        msg.innerHTML = alertHtml('ok', 'Password saved. Opening the hub…');
        setTimeout(function () { go('#/hub'); }, 1200);
      });
    });
  }

  function isAdmin() { return !!(S.profile && S.profile.role === 'admin'); }

  /* wa.me wants digits only, country code included. */
  function waLink(num) {
    var d = String(num == null ? '' : num).replace(/\D/g, '');
    return d ? 'https://wa.me/' + d : null;
  }

  /* The manager block, used on the home screen and in the profile. */
  function managerBlock(p) {
    if (!p || !p.manager_name) return '<span class="bsh-muted">No manager assigned yet.</span>';
    var wa = waLink(p.manager_whatsapp);
    return '<b style="color:var(--bsh-navy)">' + esc(p.manager_name) + '</b>' +
      (p.manager_contact ? '<br><span class="bsh-muted">' + esc(p.manager_contact) + '</span>' : '') +
      (wa
        ? '<br><a class="bsh-btn bsh-btn--ghost bsh-btn--sm" style="margin-top:12px" ' +
          'href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>'
        : '');
  }

  /* Dates are typed by hand, so both 2026-03-01 and 01.03.2026 are
     accepted and normalised. Returns null for empty, false for nonsense. */
  function parseDate(str) {
    var v = (str || '').trim();
    if (!v) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    var m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(v);
    if (m) {
      var d = ('0' + m[1]).slice(-2), mo = ('0' + m[2]).slice(-2);
      return m[3] + '-' + mo + '-' + d;
    }
    return false;
  }

  function fmtDay(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB',
        { day: '2-digit', month: 'short', year: 'numeric' });
    } catch (e) { return iso; }
  }

  /* What to say about a client's subscription. */
  function subInfo(p) {
    if (!p || !p.subscription_until) {
      return { kind: 'off', label: 'No subscription', days: null };
    }
    var end   = new Date(p.subscription_until + 'T23:59:59');
    var days  = Math.ceil((end - new Date()) / 86400000);
    if (days < 0)  return { kind: 'expired', label: 'Expired', days: days };
    if (days <= 14) return { kind: 'soon',   label: days + ' days left', days: days };
    return { kind: 'active', label: 'Active', days: days };
  }

  function subBadge(p) {
    var i = subInfo(p);
    var cls = i.kind === 'active' ? 'ok' : i.kind === 'soon' ? 'warn' : i.kind === 'expired' ? 'pink' : 'off';
    return '<span class="bsh-badge bsh-badge--' + cls + '">' + esc(i.label) + '</span>';
  }

  /* Mirrors public.has_subscription() in the database, so the interface
     closes exactly what the API refuses to hand over. The database stays
     the authority; this only decides what the reader is told. */
  function hasSubscription() {
    var p = S.profile;
    if (!p || p.status !== 'active') return false;
    var i = subInfo(p);
    return i.kind === 'active' || i.kind === 'soon';
  }

  /* A category kept behind the paywall, from this reader's point of view. */
  function catLocked(c) {
    return !!(c && c.requires_subscription) && !hasSubscription() && !isAdmin();
  }

  /* One vocabulary for every lock, so a card, a list row and the article
     page never disagree about why a piece is closed. The view hands us
     lock_reason; the fallback keeps older databases sane. */
  function lockNote(a) {
    var bySub = a.lock_reason === 'subscription' ||
                (!a.lock_reason && a.requires_subscription && !hasSubscription());
    if (bySub) {
      return {
        sub:   true,
        badge: '&#128274; Subscription',
        line:  'Opens with a subscription &rarr;',
        tip:   'Opens once you buy a subscription'
      };
    }
    return {
      sub:   false,
      badge: '&#128274; Level ' + a.min_level,
      line:  'Unlocks at level ' + a.min_level + ' &rarr;',
      tip:   'Opens at level ' + a.min_level
    };
  }

  /* Experience needed to reach a given level. */
  function expForLevel(n) {
    var row = (S.levels || []).filter(function (l) { return l.level === n; })[0];
    return row ? row.min_exp : 0;
  }

  /* A column of dots down the left edge naming the sections of the page,
     so a reader knows what is below before scrolling. Labels open on
     hover; the active section follows the scroll. */
  function railMarkup(items) {
    return '<nav class="bsh-rail" id="bsh-rail">' +
      items.map(function (it, i) {
        return '<button class="bsh-rail__item' + (i === 0 ? ' is-active' : '') +
               '" type="button" data-target="' + esc(it.id) + '">' +
                 '<span class="bsh-rail__dot"></span>' +
                 '<span class="bsh-rail__label">' + esc(it.label) + '</span>' +
               '</button>';
      }).join('') +
    '</nav>';
  }

  function wireRail() {
    var rail = document.getElementById('bsh-rail');
    if (!rail) return;
    rail.querySelectorAll('.bsh-rail__item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var el = document.getElementById(btn.getAttribute('data-target'));
        if (!el) return;
        /* clear the sticky header rather than hiding under it */
        window.scrollTo({
          top: el.getBoundingClientRect().top + window.pageYOffset - 96,
          behavior: 'smooth'
        });
      });
    });
    syncRail();
  }

  /* Highlights the section the reader is currently in. */
  function syncRail() {
    var rail = document.getElementById('bsh-rail');
    if (!rail) return;
    var items = Array.prototype.slice.call(rail.querySelectorAll('.bsh-rail__item'));
    var active = 0;
    items.forEach(function (btn, i) {
      var el = document.getElementById(btn.getAttribute('data-target'));
      if (el && el.getBoundingClientRect().top <= 150) active = i;
    });

    /* The last section often cannot reach the top of the window, so at the
       bottom of the page it is the one being read whatever the maths says. */
    var atBottom = window.innerHeight + window.pageYOffset >=
                   document.documentElement.scrollHeight - 40;
    if (atBottom) active = items.length - 1;
    items.forEach(function (btn, i) { btn.classList.toggle('is-active', i === active); });
  }

  /* The journey: milestones behind, the next one ahead. Reached dates are
     supplied by an administrator — Battle Start confirming each step is
     what gives the path its weight. */
  function journeyCard(reached, types) {
    types = types || S.msTypes || [];
    if (!types.length) return '';

    var byslug = {};
    (reached || []).forEach(function (m) { byslug[m.milestone_slug] = m; });

    var nextIdx = -1;
    for (var i = 0; i < types.length; i++) {
      if (!byslug[types[i].slug]) { nextIdx = i; break; }
    }

    /* Read top to bottom, the way a path is walked. A passed milestone
       carries its date; the ones still ahead carry what they mean. */
    var steps = types.map(function (t, i) {
      var got = byslug[t.slug];
      var cls = got ? 'is-done' : (i === nextIdx ? 'is-next' : 'is-future');
      var sub = got ? fmtDay(got.reached_on) : (t.description || '');
      return '<div class="bsh-road__step ' + cls + '">' +
        '<div class="bsh-road__dot">' + (got ? '✓' : esc(t.icon || '●')) + '</div>' +
        '<div class="bsh-road__body">' +
          '<div class="bsh-road__title">' + esc(t.title) + '</div>' +
          (sub ? '<div class="bsh-road__sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="bsh-card bsh-road-card"><div class="bsh-road">' + steps + '</div></div>';
  }

  /* The line above the journey card, which lives outside it now. */
  function journeyLead(reached, types) {
    types = types || S.msTypes || [];
    var done = 0;
    (reached || []).forEach(function (m) {
      for (var i = 0; i < types.length; i++) if (types[i].slug === m.milestone_slug) done++;
    });
    return done
      ? done + ' of ' + types.length + ' milestones behind you.'
      : 'Your manager marks each milestone as you pass it.';
  }

  /* The progress card: where the client stands, and the smallest next
     step towards the thing they cannot read yet. */
  function rankCard() {
    if (!(S.levels || []).length) return '';   /* schema not applied yet */
    var L     = levelInfo();
    var tasks = pendingTasks().slice(0, 5);
    var perk  = L.next && L.next.perk;

    /* The ring is one circle drawn twice: a rail all the way round, and
       the same circle dashed so that only the earned part is painted. */
    var R    = 76, C = 2 * Math.PI * R;
    var off  = C * (1 - Math.max(0, Math.min(100, L.pct)) / 100);

    return '<div class="bsh-card bsh-rank">' +
      '<div class="bsh-rank__head">' +
        '<span class="bsh-lvl">LVL ' + L.level + '</span>' +
        '<span class="bsh-rank__title">' + esc(L.title) + '</span>' +
      '</div>' +
      '<div class="bsh-rank__mid">' +
      '<div class="bsh-ring">' +
        '<div class="bsh-ring__glow"></div>' +
        '<svg viewBox="0 0 180 180" aria-hidden="true">' +
          '<circle class="bsh-ring__rail" cx="90" cy="90" r="' + R + '" stroke-width="13"/>' +
          '<circle class="bsh-ring__fill" cx="90" cy="90" r="' + R + '" stroke-width="13" ' +
            'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="bsh-ring__mid">' +
          '<div class="bsh-ring__icon">🏅</div>' +
          '<div class="bsh-ring__cap">' +
            (L.next ? 'To level ' + L.next.level : 'Top level') +
          '</div>' +
          '<div class="bsh-ring__pct">' + L.pct + '%</div>' +
        '</div>' +
      '</div>' +
      '<div class="bsh-rank__foot">' +
        (L.next
          ? L.toNext + ' EXP to go — ' + esc(L.next.title)
          : 'Your profile is complete.') +
      '</div>' +
      '</div>' +
    '</div>';
  }

  /* What is still on offer, and the reward waiting at the next level. */
  function tasksCard() {
    if (!(S.levels || []).length) return '';
    var L     = levelInfo();
    var tasks = pendingTasks().slice(0, 4);
    var perk  = L.next && L.next.perk;

    return '<div class="bsh-card bsh-tasks-card">' +
      '<div class="bsh-tasks__title">Earn experience</div>' +
      (tasks.length
        ? tasks.map(function (t) {
            return '<a class="bsh-task" href="#/profile">' +
              '<span>' +
                '<span class="bsh-task__label">' + esc(t.label) + '</span>' +
                (t.hint ? '<span class="bsh-task__hint">' + esc(t.hint) + '</span>' : '') +
              '</span>' +
              '<span class="bsh-task__pts">+' + t.points + '</span>' +
            '</a>';
          }).join('')
        : '<div class="bsh-tasks__done">Everything is filled in. Nothing left to earn.</div>') +
      (perk
        ? '<div class="bsh-xp__perk">' +
            '<b>Next step</b>' +
            '<span>' + esc(perk) + '</span>' +
          '</div>'
        : '') +
    '</div>';
  }

  /* ===================================================================
     SCREEN: HOME
     =================================================================== */
  function screenHome() {
    var p     = S.profile || {};
    var first = (p.full_name || '').trim().split(/\s+/)[0];

    var rankHtml    = rankCard();
    var tasksHtml   = tasksCard();
    var journeyHtml = journeyCard(S.msMine);

    /* Only an administrator can act on this, so only they are told. */
    var notice = (isAdmin() && S.missing.length)
      ? '<div class="bsh-section">' + alertHtml('info',
          'Not set up yet: ' + S.missing.join(', ') +
          '. Run schema.sql again in the SQL editor — those features are hidden until you do.') +
        '</div>'
      : '';

    /* The section index earns its place on a long, stacked page. The
       dashboard is not one: the top of it is a grid, so its parts sit
       side by side rather than one below the next, and two dots for two
       screens is furniture. It reappears on its own if the page ever
       grows a third section worth pointing at. */
    var rail = [];
    if (rankHtml || journeyHtml) rail.push({ id: 'bsh-s-progress', label: 'Where you stand' });
    rail.push({ id: 'bsh-s-latest', label: 'Latest material' });

    var lead = 'Everything ' + esc(CONFIG.brand) + ' publishes for its clients lives here: ' +
               'guides, procedures and paperwork for launching and running your venue.';

    /* The top of the page is one grid: how the client is doing on the
       left, how far they have come on the right. Each column carries its
       own heading, so the two read as separate stories side by side. */
    var top = (rankHtml || tasksHtml || journeyHtml)
      ? '<section class="bsh-section bsh-home" id="bsh-s-progress">' +
          '<div class="bsh-home__head">' +
            '<h1 class="bsh-h1"><span class="bsh-accent">Hello</span>' +
              (first ? ', ' + esc(first) : '') + '</h1>' +
            '<p class="bsh-lead" style="max-width:560px">' + lead + '</p>' +
          '</div>' +
          (journeyHtml
            ? '<div class="bsh-home__head bsh-home__head--aside">' +
                '<h2 class="bsh-h2"><span class="bsh-accent">Your</span> journey</h2>' +
                '<p class="bsh-lead">' + esc(journeyLead(S.msMine)) + '</p>' +
              '</div>'
            : '') +
          (rankHtml || tasksHtml
            ? '<div class="bsh-duo">' + rankHtml + tasksHtml + '</div>'
            : '') +
          (journeyHtml ? '<div class="bsh-home__aside">' + journeyHtml + '</div>' : '') +
        '</section>'
      /* Nothing to show yet: the greeting still needs somewhere to live. */
      : '<section class="bsh-hero">' +
          '<h1 class="bsh-h1"><span class="bsh-accent">Hello</span>' +
            (first ? ', ' + esc(first) : '') + '</h1>' +
          '<p class="bsh-lead" style="max-width:620px">' + lead + '</p>' +
        '</section>';

    paint((rail.length > 2 ? railMarkup(rail) : '') +
      header('hub') +
      '<div class="bsh-wrap">' +
        top +
        notice +
        '<section class="bsh-section bsh-recent" id="bsh-s-latest">' +
          '<h2 class="bsh-h2"><span class="bsh-accent">Latest</span> material</h2>' +
          '<div class="bsh-card" style="margin-top:18px">' + feedRows() + '</div>' +
        '</section>' +
      '</div>');

    bindLogout();
    wireRail();
  }

  /* The feed is redrawn on its own as the filter and the search change,
     so the rest of the page — and the page's scroll position — stays put. */
  /* The newest handful, and nothing to operate. Filtering and search
     belong to the knowledge base, which is one tap away and does both
     properly; a second set of the same controls here only asked the
     reader which of the two to use. */
  function feedRows() {
    var list = (S.arts || []).slice().sort(function (a, b) {
      return (b.created_at || '') > (a.created_at || '') ? 1 : -1;
    }).slice(0, 6);

    if (!list.length) {
      return '<div class="bsh-empty"><div class="bsh-empty__icon">📭</div>' +
             'Nothing published yet</div>';
    }

    return list.map(function (a) {
      var c      = catById(a.category_id);
      var locked = a.unlocked === false;
      return '<a class="bsh-recent__row" href="#/kb/a/' + esc(a.slug) + '">' +
        (c ? '<span class="bsh-badge">' + esc(c.title) + '</span>' : '') +
        '<span class="bsh-recent__body">' +
          '<span class="bsh-recent__title">' + esc(a.title) + '</span>' +
          (a.summary ? '<span class="bsh-recent__sum">' + esc(a.summary) + '</span>' : '') +
        '</span>' +
        (locked
          ? '<span class="bsh-badge bsh-badge--pink bsh-tip" data-tip="' +
            esc(lockNote(a).tip) + '">' + lockNote(a).badge + '</span>'
          : '') +
        '<span class="bsh-recent__arrow">→</span></a>';
    }).join('');
  }


  /* ===================================================================
     SCREEN: KNOWLEDGE BASE LIST
     =================================================================== */
  function screenKb(catSlug) {
    var active = catSlug ? catBySlug(catSlug) : null;

    var list = (S.arts || []).filter(function (a) {
      if (active && a.category_id !== active.id) return false;
      if (S.kbQuery) {
        var hay = (a.title + ' ' + (a.summary || '')).toLowerCase();
        if (hay.indexOf(S.kbQuery.toLowerCase()) === -1) return false;
      }
      return true;
    });

    var tabs = '<button class="bsh-tab' + (!active ? ' is-active' : '') + '" data-cat="">Everything</button>' +
      (S.cats || []).map(function (c) {
        var shut = catLocked(c);
        return '<button class="bsh-tab' + (active && active.id === c.id ? ' is-active' : '') +
               (shut ? ' bsh-tab--locked bsh-tip' : '') + '" data-cat="' + esc(c.slug) + '"' +
               (shut ? ' data-tip="Opens once you buy a subscription"' : '') + '>' +
               (shut ? '🔒 ' : (c.icon ? esc(c.icon) + ' ' : '')) + esc(c.title) + '</button>';
      }).join('');

    var cards = list.map(function (a) {
      var c      = catById(a.category_id);
      var locked = a.unlocked === false;
      var note   = locked ? lockNote(a) : null;

      return '<a class="bsh-art' + (locked ? ' bsh-art--locked' : '') +
               '" href="#/kb/a/' + esc(a.slug) + '">' +
        '<div class="bsh-art__top">' +
          (c ? '<span class="bsh-badge">' + esc(c.title) + '</span>' : '') +
          (locked
            ? '<span class="bsh-badge bsh-badge--pink bsh-tip" data-tip="' + esc(note.tip) + '">' +
              note.badge + '</span>'
            : (a.reading_time ? '<span class="bsh-label">' + a.reading_time + ' min</span>' : '')) +
        '</div>' +
        '<div class="bsh-art__title">' + esc(a.title) + '</div>' +
        (a.summary ? '<div class="bsh-art__sum">' + esc(a.summary) + '</div>' : '') +
        (locked
          ? '<div class="bsh-art__lock">' + note.line + '</div>'
          : '<div class="bsh-art__more">Read →</div>') +
      '</a>';
    }).join('');

    paint(header('kb') +
      '<div class="bsh-wrap bsh-kb">' +
        '<h1 class="bsh-h1"><span class="bsh-accent">Knowledge</span> base</h1>' +
        '<p class="bsh-lead" style="margin-bottom:28px">' +
          (active && active.description
            ? esc(active.description)
            : 'Everything about launching and running a ' + esc(CONFIG.brand) + ' venue.') +
        '</p>' +
        '<div class="bsh-card">' +
          '<div class="bsh-kb__search">' +
            '<input class="bsh-input" id="bsh-q" type="search" placeholder="Search the knowledge base" value="' +
              esc(S.kbQuery) + '">' +
          '</div>' +
          '<div class="bsh-tabs">' + tabs + '</div>' +
          /* The padlock on the tab explains itself on hover, and a phone
             cannot hover. Opening the section says it in plain sight. */
          (catLocked(active)
            ? '<div class="bsh-alert bsh-alert--info bsh-kb__note">' +
                '🔒 This section opens once you buy a subscription. ' +
                'Your manager can set one up — their details are on your ' +
                '<a class="bsh-link" href="#/profile">profile</a>.' +
              '</div>'
            : '') +
          (cards
            ? '<div class="bsh-kb__grid">' + cards + '</div>'
            : '<div class="bsh-empty"><div class="bsh-empty__icon">🔍</div>' +
              (S.kbQuery ? 'Nothing matches that search' : 'This category is empty so far') + '</div>') +
        '</div>' +
      '</div>');

    bindLogout();

    app.querySelectorAll('.bsh-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var slug = btn.getAttribute('data-cat');
        go(slug ? '#/kb/c/' + slug : '#/kb');
      });
    });
    /* On a phone the chips are one scrolling row, so the chosen one has
       to be brought into view or it sits off-screen with no sign of it. */
    revealActive(app.querySelector('.bsh-tabs'), '.bsh-tab.is-active');

    var input = document.getElementById('bsh-q');
    input.addEventListener('input', function () {
      S.kbQuery = input.value;
      var pos = input.selectionStart;
      screenKb(catSlug);
      var again = document.getElementById('bsh-q');
      again.focus();
      again.setSelectionRange(pos, pos);
    });
  }

  /* ===================================================================
     SCREEN: ARTICLE
     =================================================================== */
  function screenArticle(slug) {
    paint(header('kb') +
      '<div class="bsh-wrap bsh-kb"><div class="bsh-card">' +
        '<div class="bsh-skel" style="height:30px;width:60%;margin-bottom:20px"></div>' +
        '<div class="bsh-skel" style="height:16px;margin-bottom:10px"></div>' +
        '<div class="bsh-skel" style="height:16px;width:90%"></div>' +
      '</div></div>');
    bindLogout();

    var article = null;

    sb.from('kb_articles').select('*').eq('slug', slug).eq('is_published', true).maybeSingle()
      .then(function (r) {
        if (r.error) throw r.error;
        if (!r.data) {
          /* RLS returns nothing for an article above the client's level.
             The catalogue still knows it exists, so say what it is and
             what it costs rather than pretending it is missing. */
          var teaser = (S.arts || []).filter(function (x) { return x.slug === slug; })[0];
          if (teaser && teaser.unlocked === false) lockedScreen(teaser);
          else notFound();
          return null;
        }
        article = r.data;
        return sb.from('kb_files').select('*').eq('article_id', article.id)
          .order('sort_order', { ascending: true });
      })
      .then(function (f) {
        if (!article) return;
        draw(article, (f && f.data) || []);
      })
      .catch(function (err) {
        paint(header('kb') + '<div class="bsh-wrap bsh-kb"><div class="bsh-card">' +
              alertHtml('error', humanError(err)) + '</div></div>');
        bindLogout();
      });

    function draw(art, files) {
      var c = catById(art.category_id);
      var icons = { pdf: '📕', zip: '🗜', image: '🖼', video: '🎬', link: '🔗', file: '📎' };

      paint(header('kb') +
        '<div class="bsh-wrap bsh-kb">' +
          '<a class="bsh-back" href="#/kb' + (c ? '/c/' + esc(c.slug) : '') + '">← ' +
            (c ? esc(c.title) : 'All articles') + '</a>' +
          '<div class="bsh-card" style="max-width:860px;margin:0 auto">' +
            '<h1 class="bsh-h2">' + esc(art.title) + '</h1>' +
            '<div class="bsh-art__meta">' +
              (c ? '<span class="bsh-badge bsh-badge--pink">' + esc(c.title) + '</span>' : '') +
              (art.reading_time ? '<span class="bsh-badge">' + art.reading_time + ' min read</span>' : '') +
              '<span class="bsh-badge">Updated ' + fmtDate(art.updated_at || art.created_at) + '</span>' +
            '</div>' +
            (art.cover_url ? '<img class="bsh-art__cover" src="' + esc(art.cover_url) + '" alt="">' : '') +
            '<div class="bsh-prose">' + markdown(art.content_md) + '</div>' +
            (files.length
              ? '<div class="bsh-files"><h3 class="bsh-h3">Files</h3>' +
                files.map(function (f) {
                  return '<a class="bsh-file" href="' + esc(f.url) + '" target="_blank" rel="noopener">' +
                    '<span class="bsh-file__icon">' + (icons[f.kind] || icons.file) + '</span>' +
                    '<span><span class="bsh-file__title">' + esc(f.title) + '</span>' +
                    (f.size_label ? '<span class="bsh-file__size">' + esc(f.size_label) + '</span>' : '') +
                    '</span><span class="bsh-file__dl">Download</span></a>';
                }).join('') + '</div>'
              : '') +
          '</div>' +
        '</div>');

      bindLogout();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function notFound() {
    paint(header('kb') +
      '<div class="bsh-wrap bsh-kb"><a class="bsh-back" href="#/kb">← All articles</a>' +
      '<div class="bsh-card"><div class="bsh-empty">' +
      '<div class="bsh-empty__icon">🤷</div>Article not found</div></div></div>');
    bindLogout();
  }

  /* The locked article: visible as a promise, unreadable until earned.
     Two kinds of lock, two things to say. Experience is something the
     reader can go and earn right now, so that screen points at the
     profile; a subscription is a conversation with a manager, so that
     screen puts the manager in front of them instead. */
  function lockedScreen(row) {
    if (lockNote(row).sub) return lockedBySubscription(row);
    var L      = levelInfo();
    var needed = expForLevel(row.min_level);
    var short  = Math.max(0, needed - L.exp);
    var pct    = needed > 0 ? Math.min(100, Math.round(L.exp / needed * 100)) : 100;

    paint(header('kb') +
      '<div class="bsh-wrap bsh-kb">' +
        '<a class="bsh-back" href="#/kb">← All articles</a>' +
        '<div class="bsh-card" style="max-width:720px;margin:0 auto">' +
          '<div class="bsh-locked">' +
            '<div class="bsh-locked__icon">🔒</div>' +
            '<h1 class="bsh-h2">' + esc(row.title) + '</h1>' +
            (row.summary
              ? '<p class="bsh-lead bsh-muted" style="max-width:540px;margin:12px auto 0">' +
                esc(row.summary) + '</p>'
              : '') +
            '<p class="bsh-lead" style="margin-top:26px">' +
              'Opens at <span class="bsh-accent">level ' + row.min_level + '</span>' +
              (short > 0 ? ' — ' + short + ' EXP to go' : '') +
            '</p>' +
            '<div class="bsh-locked__bar">' +
              '<div class="bsh-xp__bar"><div class="bsh-xp__fill" style="width:' + pct + '%"></div></div>' +
              '<div class="bsh-xp__hint">' + L.exp + ' / ' + needed + ' EXP</div>' +
            '</div>' +
            '<a class="bsh-btn bsh-btn--accent" href="#/profile" style="margin-top:26px">' +
              'Fill in your arena details</a>' +
          '</div>' +
        '</div>' +
      '</div>');
    bindLogout();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* Closed because the venue has no live subscription. Nothing here is
     earnable by clicking, so the screen names the material, says plainly
     what opens it, and hands over the manager. */
  function lockedBySubscription(row) {
    var p   = S.profile || {};
    var i   = subInfo(p);
    var cat = catById(row.category_id);

    paint(header('kb') +
      '<div class="bsh-wrap bsh-kb">' +
        '<a class="bsh-back" href="#/kb">← All articles</a>' +
        '<div class="bsh-card" style="max-width:720px;margin:0 auto">' +
          '<div class="bsh-locked">' +
            '<div class="bsh-locked__icon">🔒</div>' +
            (cat ? '<span class="bsh-badge">' + esc(cat.title) + '</span>' : '') +
            '<h1 class="bsh-h2" style="margin-top:12px">' + esc(row.title) + '</h1>' +
            (row.summary
              ? '<p class="bsh-lead bsh-muted" style="max-width:540px;margin:12px auto 0">' +
                esc(row.summary) + '</p>'
              : '') +
            '<p class="bsh-lead" style="margin-top:26px">' +
              'Opens once you buy a <span class="bsh-accent">subscription</span>.' +
            '</p>' +
            '<p class="bsh-muted" style="margin-top:8px">' +
              (i.kind === 'expired'
                ? 'Your subscription ran out on ' + esc(fmtDay(p.subscription_until)) +
                  '. Renew it and this section opens again.'
                : 'Your manager can set one up for you.') +
            '</p>' +
            '<div class="bsh-card bsh-card--flat" style="margin-top:24px;text-align:left">' +
              '<div class="bsh-label" style="margin-bottom:8px">Your manager</div>' +
              managerBlock(p) +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>');
    bindLogout();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ===================================================================
     SCREEN: PROFILE
     =================================================================== */
  function screenProfile() {
    var p = S.profile || {};
    var email = S.session.user.email;

    /* An unfilled field advertises what it is worth; once earned the
       badge disappears, so the form always shows what is still on offer. */
    function pts(name) {
      var r = (S.rules || []).filter(function (x) { return x.field === name; })[0];
      if (!r) return '';
      var v = (p[name] == null ? '' : String(p[name])).trim();
      if (v.length >= (r.min_length || 1)) return '';
      return '<span class="bsh-pts">+' + r.points + ' EXP</span>';
    }

    function field(id, name, label, type, ph) {
      return '<div class="bsh-field">' +
        '<label class="bsh-field__label" for="' + id + '">' + label + pts(name) + '</label>' +
        '<input class="bsh-input" id="' + id + '" type="' + (type || 'text') +
          '" value="' + esc(p[name] || '') + '" placeholder="' + esc(ph || '') + '">' +
      '</div>';
    }

    function area(id, name, label, ph) {
      return '<div class="bsh-field">' +
        '<label class="bsh-field__label" for="' + id + '">' + label + pts(name) + '</label>' +
        '<textarea class="bsh-input" id="' + id + '" placeholder="' + esc(ph || '') + '">' +
          esc(p[name] || '') + '</textarea>' +
      '</div>';
    }

    paint(header('profile') +
      '<div class="bsh-wrap bsh-profile">' +
        '<h1 class="bsh-h1"><span class="bsh-accent">Your</span> profile</h1>' +
        '<p class="bsh-lead" style="margin-bottom:30px">Details of your venue. ' +
          'Only you and the ' + esc(CONFIG.brand) + ' team can see them.</p>' +

        '<div class="bsh-profile__cols">' +

          '<div class="bsh-card">' +
            '<div class="bsh-profile__head">' +
              '<div class="bsh-profile__ava">' + esc(initials(p.full_name, email)) + '</div>' +
              '<div>' +
                '<div class="bsh-profile__name">' + esc(p.full_name || 'Unnamed') + '</div>' +
                '<div class="bsh-profile__mail">' + esc(email) + '</div>' +
              '</div>' +
            '</div>' +

            '<div id="bsh-msg">' +
              (S.profile ? '' : alertHtml('info', 'No profile yet. Save your details and one will be created.')) +
            '</div>' +

            '<form id="bsh-form">' +
              field('bsh-f-name', 'full_name', 'Full name', 'text', 'How should we address you?') +
              '<div class="bsh-profile__row">' +
                field('bsh-f-company', 'company', 'Venue name', 'text', 'Battle Start Camden') +
                field('bsh-f-city', 'city', 'City', 'text', 'London') +
              '</div>' +
              '<div class="bsh-profile__row">' +
                field('bsh-f-phone', 'phone', 'Phone', 'tel', '+44 20 0000 0000') +
                field('bsh-f-wa', 'whatsapp', 'WhatsApp', 'tel', '+44 7700 900000') +
              '</div>' +

              '<hr class="bsh-divider">' +
              '<h3 class="bsh-h3">Your arena</h3>' +
              '<p class="bsh-label" style="margin-bottom:18px">' +
                'The more complete this is, the more of the knowledge base opens up.</p>' +

              field('bsh-f-address', 'address', 'Full address', 'text', 'Street and building') +
              '<div class="bsh-profile__row">' +
                field('bsh-f-website', 'website', 'Website', 'url', 'https://') +
                field('bsh-f-logo', 'logo_url', 'Logo', 'url', 'https://') +
              '</div>' +
              '<div class="bsh-profile__row">' +
                field('bsh-f-fb', 'social_facebook', 'Facebook page', 'url', 'https://facebook.com/') +
                field('bsh-f-ig', 'social_instagram', 'Instagram', 'text', '@arena') +
              '</div>' +
              field('bsh-f-tgch', 'social_telegram', 'Telegram channel', 'text', '@arena_channel') +
              area('bsh-f-about', 'about', 'About the arena',
                   'What makes your arena worth visiting? 80 characters or more.') +

              '<div class="bsh-profile__actions">' +
                '<button class="bsh-btn bsh-btn--primary" type="submit" id="bsh-save">Save</button>' +
                '<button class="bsh-btn bsh-btn--ghost" type="button" id="bsh-cancel">Cancel</button>' +
              '</div>' +
            '</form>' +
          '</div>' +

          '<div>' +
            '<div class="bsh-tiles">' +
              tile('Experience', 'Level ' + levelInfo().level + ' · ' + levelInfo().exp + ' EXP', true) +
              '<div class="bsh-tile">' +
                '<div class="bsh-tile__label">Subscription</div>' +
                '<div class="bsh-sub">' +
                  '<span class="bsh-sub__plan">' + esc(p.plan || 'Not set') + '</span>' +
                  (p.subscription_from || p.subscription_until
                    ? '<span class="bsh-sub__dates">' + esc(fmtDay(p.subscription_from)) +
                      ' — ' + esc(fmtDay(p.subscription_until)) + '</span>'
                    : '') +
                  '<span style="margin-top:8px">' +
                    (p.status === 'suspended'
                      ? '<span class="bsh-badge bsh-badge--pink">Access suspended</span>'
                      : subBadge(p)) +
                  '</span>' +
                '</div>' +
              '</div>' +
              tile('Venue', p.company || 'Not set') +
              tile('Member since', fmtDate(p.created_at || S.session.user.created_at)) +
            '</div>' +
            '<div class="bsh-card bsh-card--flat bsh-card--pad-sm">' +
              '<div class="bsh-tile__label" style="margin-bottom:10px">Your manager</div>' +
              '<div style="font-size:14px">' + managerBlock(p) + '</div>' +
            '</div>' +
          '</div>' +

        '</div>' +
      '</div>');

    bindLogout();

    var msg  = document.getElementById('bsh-msg');
    var save = document.getElementById('bsh-save');

    document.getElementById('bsh-form').addEventListener('submit', function (e) {
      e.preventDefault();
      msg.innerHTML = '';
      save.classList.add('is-busy');
      save.innerHTML = '<span class="bsh-spinner"></span>Saving…';

      var before = levelInfo();

      /* exp is a generated column — it is never sent, only read back. */
      var patch = {
        id:               S.session.user.id,
        full_name:        val('bsh-f-name'),
        company:          val('bsh-f-company'),
        city:             val('bsh-f-city'),
        phone:            val('bsh-f-phone'),
        whatsapp:         val('bsh-f-wa'),
        address:          val('bsh-f-address'),
        website:          val('bsh-f-website'),
        logo_url:         val('bsh-f-logo'),
        social_facebook:  val('bsh-f-fb'),
        social_instagram: val('bsh-f-ig'),
        social_telegram:  val('bsh-f-tgch'),
        about:            val('bsh-f-about')
      };

      sb.from('profiles').upsert(patch).select().single().then(function (r) {
        save.classList.remove('is-busy');
        save.textContent = 'Save';
        if (r.error) { msg.innerHTML = alertHtml('error', humanError(r.error)); return; }

        S.profile = r.data;
        var after  = levelInfo();
        var gained = after.exp - before.exp;

        /* A new level changes what the catalogue unlocks, so it is refetched. */
        var done = function () {
          screenProfile();
          var box = document.getElementById('bsh-msg');
          if (after.level > before.level) {
            box.innerHTML = alertHtml('ok',
              'Level ' + after.level + ' reached — ' + after.title + '. ' +
              'New material is open in the knowledge base.');
          } else if (gained > 0) {
            box.innerHTML = alertHtml('ok',
              'Saved. +' + gained + ' EXP' +
              (after.next ? ' — ' + after.toNext + ' to level ' + after.next.level : ''));
          } else {
            box.innerHTML = alertHtml('ok', 'Details saved');
          }
        };

        if (after.level !== before.level) { S.arts = null; loadIndex().then(done, done); }
        else done();
      });
    });

    document.getElementById('bsh-cancel').addEventListener('click', function () { screenProfile(); });

    function val(id) { return document.getElementById(id).value.trim() || null; }
    function tile(label, value, pink) {
      return '<div class="bsh-tile"><div class="bsh-tile__label">' + label + '</div>' +
             '<div class="bsh-tile__value' + (pink ? ' bsh-tile__value--pink' : '') + '">' +
             esc(value) + '</div></div>';
    }
  }

  /* ===================================================================
     SCREENS: ADMINISTRATION
     Reachable only with role = 'admin'. The database enforces that too —
     the policies on profiles let an administrator read and write every
     row, and let a client touch nothing but their own.
     =================================================================== */

  function loadClients(force) {
    if (S.clients && !force) return Promise.resolve();
    return sb.from('profiles').select('*').order('created_at', { ascending: false })
      .then(function (r) {
        if (r.error) throw r.error;
        S.clients = r.data || [];
      });
  }

  /* One labelled text box. Everything is typed in — no pickers, no lists. */
  function af(id, label, value, ph, note) {
    return '<div class="bsh-field">' +
      '<label class="bsh-field__label" for="' + id + '">' + label + '</label>' +
      '<input class="bsh-input" id="' + id + '" type="text" value="' + esc(value == null ? '' : value) +
        '" placeholder="' + esc(ph || '') + '">' +
      (note ? '<p class="bsh-label" style="margin-top:6px">' + note + '</p>' : '') +
    '</div>';
  }

  function group(title, note) {
    return '<div class="bsh-adm__group"><h3>' + title + '</h3>' +
           (note ? '<p>' + note + '</p>' : '') + '</div>';
  }

  /* ---------------- the list ---------------- */
  function screenAdminList() {
    if (!isAdmin()) return go('#/hub');

    paint(header('admin') +
      '<div class="bsh-wrap bsh-adm"><div class="bsh-card">' +
        '<div class="bsh-skel" style="height:24px;width:30%;margin-bottom:18px"></div>' +
        '<div class="bsh-skel" style="height:56px;margin-bottom:10px"></div>' +
        '<div class="bsh-skel" style="height:56px"></div>' +
      '</div></div>');
    bindLogout();

    loadClients().then(function () {
      var q = (S.adminQuery || '').toLowerCase();
      var list = (S.clients || []).filter(function (c) {
        if (!q) return true;
        return [c.full_name, c.company, c.city, c.email, c.plan]
          .join(' ').toLowerCase().indexOf(q) !== -1;
      });

      paint(header('admin') +
        '<div class="bsh-wrap bsh-adm">' +
          '<h1 class="bsh-h1"><span class="bsh-accent">Clients</span></h1>' +
          '<p class="bsh-lead" style="margin-bottom:26px">' +
            (S.clients || []).length + ' account' + ((S.clients || []).length === 1 ? '' : 's') +
            ' — open one to edit it, or add a new one.</p>' +

          '<div class="bsh-card">' +
            '<div class="bsh-adm__bar">' +
              '<div class="bsh-adm__search">' +
                '<input class="bsh-input" id="bsh-adm-q" type="search" ' +
                  'placeholder="Search by name, venue, city or plan" value="' + esc(S.adminQuery || '') + '">' +
              '</div>' +
              '<a class="bsh-btn bsh-btn--accent" href="#/admin/new">Add client</a>' +
            '</div>' +

            (list.length
              ? list.map(function (c) {
                  var i = subInfo(c);
                  return '<a class="bsh-adm__row" href="#/admin/c/' + esc(c.id) + '">' +
                    '<span class="bsh-adm__who">' +
                      '<span class="bsh-adm__name">' + esc(c.full_name || 'Unnamed') +
                        (c.role !== 'client' ? ' <span class="bsh-badge bsh-badge--blue">' + esc(c.role) + '</span>' : '') +
                      '</span>' +
                      '<span class="bsh-adm__mail">' + esc(c.email || '') + '</span>' +
                    '</span>' +
                    '<span class="bsh-adm__cell"><b>Venue</b>' + esc(c.company || '—') + '</span>' +
                    '<span class="bsh-adm__cell"><b>Plan</b>' + esc(c.plan || '—') + '</span>' +
                    '<span class="bsh-adm__cell"><b>Paid until</b>' + esc(fmtDay(c.subscription_until)) + '</span>' +
                    '<span class="bsh-adm__cell">' + subBadge(c) + '</span>' +
                    '<span class="bsh-adm__arrow">→</span>' +
                  '</a>';
                }).join('')
              : '<div class="bsh-empty"><div class="bsh-empty__icon">🔍</div>Nobody matches that search</div>') +
          '</div>' +
        '</div>');

      bindLogout();

      var input = document.getElementById('bsh-adm-q');
      input.addEventListener('input', function () {
        S.adminQuery = input.value;
        var pos = input.selectionStart;
        screenAdminList();
        var again = document.getElementById('bsh-adm-q');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      });
    }).catch(function (e) {
      paint(header('admin') + '<div class="bsh-wrap bsh-adm"><div class="bsh-card">' +
            alertHtml('error', humanError(e)) + '</div></div>');
      bindLogout();
    });
  }

  /* ---------------- editing one client ---------------- */
  /* flash: markup shown in the message slot once the form is on screen.
     The render is asynchronous, so writing into #bsh-msg from the caller
     would be wiped by the repaint that follows. */
  function screenAdminEdit(id, flash) {
    if (!isAdmin()) return go('#/hub');

    return Promise.all([
      loadClients(),
      sb.from('client_milestones').select('*').eq('profile_id', id)
    ]).then(function (res) {
      if (res[1] && res[1].error) throw res[1].error;
      var ms = (res[1] && res[1].data) || [];
      var msBySlug = {};
      ms.forEach(function (m) { msBySlug[m.milestone_slug] = m; });

      var c = (S.clients || []).filter(function (x) { return x.id === id; })[0];
      if (!c) {
        paint(header('admin') + '<div class="bsh-wrap bsh-adm">' +
          '<a class="bsh-back" href="#/admin">← All clients</a>' +
          '<div class="bsh-card"><div class="bsh-empty">' +
          '<div class="bsh-empty__icon">🤷</div>No such client</div></div></div>');
        bindLogout();
        return;
      }

      paint(header('admin') +
        '<div class="bsh-wrap bsh-adm">' +
          '<a class="bsh-back" href="#/admin">← All clients</a>' +
          '<div class="bsh-card" style="max-width:860px">' +
            '<div class="bsh-profile__head">' +
              '<div class="bsh-profile__ava">' + esc(initials(c.full_name, c.email)) + '</div>' +
              '<div>' +
                '<div class="bsh-profile__name">' + esc(c.full_name || 'Unnamed') + '</div>' +
                '<div class="bsh-profile__mail">' + esc(c.email || '') + ' · ' +
                  'Level ' + levelOf(c) + ' · ' + expOf(c) + ' EXP</div>' +
              '</div>' +
              '<div style="margin-left:auto">' + subBadge(c) + '</div>' +
            '</div>' +

            '<div id="bsh-msg"></div>' +

            '<form id="bsh-adm-form">' +

              group('Subscription', 'Typed in by hand. Dates accept 2026-03-01 or 01.03.2026.') +
              af('bsh-a-plan', 'Plan', c.plan, 'Whatever was agreed, in your own words') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-from', 'Paid from', c.subscription_from, '2026-03-01') +
                af('bsh-a-until', 'Paid until', c.subscription_until, '2026-09-01') +
              '</div>' +

              group('Manager') +
              af('bsh-a-mgr', 'Manager name', c.manager_name, 'Anna Kovaleva') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-mgrc', 'Contact', c.manager_contact, '@bs_anna · +44 20 7946 0000') +
                af('bsh-a-mgrw', 'WhatsApp', c.manager_whatsapp, '447700900123',
                   'Digits only, with the country code — it becomes a wa.me link.') +
              '</div>' +

              group('Client') +
              af('bsh-a-name', 'Full name', c.full_name, 'Jane Doe') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-company', 'Venue name', c.company, 'Battle Start Camden') +
                af('bsh-a-city', 'City', c.city, 'London') +
              '</div>' +
              af('bsh-a-address', 'Address', c.address, 'Street and building') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-phone', 'Phone', c.phone, '+44 20 0000 0000') +
                af('bsh-a-wa', 'WhatsApp', c.whatsapp, '+44 7700 900000') +
              '</div>' +
              '<div class="bsh-profile__row">' +
                af('bsh-a-web', 'Website', c.website, 'https://') +
                af('bsh-a-logo', 'Logo', c.logo_url, 'https://') +
              '</div>' +
              '<div class="bsh-profile__row">' +
                af('bsh-a-fb', 'Facebook', c.social_facebook, 'https://facebook.com/') +
                af('bsh-a-ig', 'Instagram', c.social_instagram, '@arena') +
              '</div>' +
              af('bsh-a-tgch', 'Telegram channel', c.social_telegram, '@arena_channel') +

              group('Journey', 'A date marks the milestone as reached. Clear it to undo.') +
              (S.msTypes || []).map(function (t) {
                var got = msBySlug[t.slug];
                return af('bsh-a-ms-' + t.slug,
                          (t.icon ? t.icon + ' ' : '') + t.title,
                          got ? got.reached_on : '',
                          '2026-03-01');
              }).join('') +

              group('Access') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-role', 'Role', c.role, 'client', 'client, staff or admin') +
                af('bsh-a-status', 'Status', c.status, 'active',
                   'active or suspended — suspending hides the knowledge base') +
              '</div>' +

              '<div class="bsh-profile__actions" style="margin-top:24px">' +
                '<button class="bsh-btn bsh-btn--primary" type="submit" id="bsh-a-save">Save changes</button>' +
                '<a class="bsh-btn bsh-btn--ghost" href="#/admin">Cancel</a>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>');

      bindLogout();
      if (flash) document.getElementById('bsh-msg').innerHTML = flash;

      document.getElementById('bsh-adm-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var msg  = document.getElementById('bsh-msg');
        var btn  = document.getElementById('bsh-a-save');
        msg.innerHTML = '';

        var from  = parseDate(v('bsh-a-from'));
        var until = parseDate(v('bsh-a-until'));
        if (from === false || until === false) {
          msg.innerHTML = alertHtml('error', 'A date must look like 2026-03-01 or 01.03.2026');
          return;
        }
        if (from && until && from > until) {
          msg.innerHTML = alertHtml('error', 'The subscription ends before it starts');
          return;
        }

        var badMilestone = null;
        (S.msTypes || []).forEach(function (t) {
          var el = document.getElementById('bsh-a-ms-' + t.slug);
          if (el && parseDate(el.value) === false) badMilestone = t.title;
        });
        if (badMilestone) {
          msg.innerHTML = alertHtml('error',
            'The date for "' + badMilestone + '" must look like 2026-03-01 or 01.03.2026');
          return;
        }

        btn.classList.add('is-busy');
        btn.innerHTML = '<span class="bsh-spinner"></span>Saving…';

        var patch = {
          plan:               v('bsh-a-plan')    || null,
          subscription_from:  from,
          subscription_until: until,
          manager_name:       v('bsh-a-mgr')     || null,
          manager_contact:    v('bsh-a-mgrc')    || null,
          manager_whatsapp:   v('bsh-a-mgrw')    || null,
          full_name:          v('bsh-a-name')    || null,
          company:            v('bsh-a-company') || null,
          city:               v('bsh-a-city')    || null,
          address:            v('bsh-a-address') || null,
          phone:              v('bsh-a-phone')   || null,
          whatsapp:           v('bsh-a-wa')      || null,
          website:            v('bsh-a-web')     || null,
          logo_url:           v('bsh-a-logo')    || null,
          social_facebook:    v('bsh-a-fb')      || null,
          social_instagram:   v('bsh-a-ig')      || null,
          social_telegram:    v('bsh-a-tgch')    || null,
          role:               v('bsh-a-role')    || 'client',
          status:             v('bsh-a-status')  || 'active'
        };

        sb.from('profiles').update(patch).eq('id', id).select().maybeSingle()
          .then(function (r) {
            if (r.error) throw r.error;
            /* Refresh the admin's own profile too if they edited themselves. */
            if (id === S.session.user.id) S.profile = r.data;
            return saveJourney();
          })
          .then(function () { return loadClients(true); })
          .then(function () {
            screenAdminEdit(id, alertHtml('ok', 'Saved'));
          })
          .catch(function (err) {
            btn.classList.remove('is-busy');
            btn.textContent = 'Save changes';
            msg.innerHTML = alertHtml('error', humanError(err));
          });

        /* A filled date means the milestone is behind them; an empty one
           means it is not, so the row goes away. */
        function saveJourney() {
          var reached = [], cleared = [];
          (S.msTypes || []).forEach(function (t) {
            var el = document.getElementById('bsh-a-ms-' + t.slug);
            if (!el) return;
            var d = parseDate(el.value);
            if (d) reached.push({ profile_id: id, milestone_slug: t.slug, reached_on: d });
            else cleared.push(t.slug);
          });

          var jobs = [];
          if (reached.length) {
            jobs.push(sb.from('client_milestones').upsert(reached).then(check));
          }
          if (cleared.length) {
            jobs.push(sb.from('client_milestones').delete()
              .eq('profile_id', id).in('milestone_slug', cleared).then(check));
          }
          return Promise.all(jobs);

          function check(r) { if (r.error) throw r.error; }
        }

        function v(elId) { return document.getElementById(elId).value.trim(); }
      });
    });
  }

  /* ---------------- adding a client ---------------- */
  function screenAdminNew() {
    if (!isAdmin()) return go('#/hub');

    paint(header('admin') +
      '<div class="bsh-wrap bsh-adm">' +
        '<a class="bsh-back" href="#/admin">← All clients</a>' +
        '<div class="bsh-card" style="max-width:720px">' +
          '<h1 class="bsh-h2"><span class="bsh-accent">New</span> client</h1>' +
          '<p class="bsh-lead bsh-muted" style="font-size:15px;margin-bottom:24px">' +
            'The account is created straight away and confirmed — hand the ' +
            'password over yourself. The client can change it in their profile.</p>' +

          '<div id="bsh-msg"></div>' +

          '<form id="bsh-new-form">' +
            af('bsh-n-email', 'Email', '', 'client@example.com') +
            af('bsh-n-pass', 'Password', '', 'At least 8 characters',
               'Generate something and send it over a channel you trust.') +

            group('Optional now, editable later') +
            af('bsh-n-name', 'Full name', '', 'Jane Doe') +
            '<div class="bsh-profile__row">' +
              af('bsh-n-company', 'Venue name', '', 'Battle Start Camden') +
              af('bsh-n-city', 'City', '', 'London') +
            '</div>' +
            '<div class="bsh-profile__row">' +
              af('bsh-n-plan', 'Plan', '', 'Whatever was agreed') +
              af('bsh-n-until', 'Paid until', '', '2026-09-01') +
            '</div>' +
            af('bsh-n-mgr', 'Manager name', '', 'Anna Kovaleva') +
            '<div class="bsh-profile__row">' +
              af('bsh-n-mgrc', 'Manager contact', '', '@bs_anna') +
              af('bsh-n-mgrw', 'Manager WhatsApp', '', '447700900123') +
            '</div>' +

            '<div class="bsh-profile__actions" style="margin-top:24px">' +
              '<button class="bsh-btn bsh-btn--accent" type="submit" id="bsh-n-save">Create account</button>' +
              '<a class="bsh-btn bsh-btn--ghost" href="#/admin">Cancel</a>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>');

    bindLogout();

    document.getElementById('bsh-new-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('bsh-msg');
      var btn = document.getElementById('bsh-n-save');
      msg.innerHTML = '';

      var email = v('bsh-n-email').toLowerCase();
      var pass  = v('bsh-n-pass');
      var until = parseDate(v('bsh-n-until'));

      if (email.indexOf('@') === -1) { msg.innerHTML = alertHtml('error', 'Enter a valid email'); return; }
      if (pass.length < 8)           { msg.innerHTML = alertHtml('error', 'The password must be at least 8 characters'); return; }
      if (until === false)           { msg.innerHTML = alertHtml('error', 'A date must look like 2026-03-01 or 01.03.2026'); return; }

      btn.classList.add('is-busy');
      btn.innerHTML = '<span class="bsh-spinner"></span>Creating…';

      /* Account creation needs the service role key, which must never be
         in a page. The Edge Function holds it and checks the caller. */
      sb.functions.invoke('admin-create-client', {
        body: {
          email: email, password: pass,
          full_name:        v('bsh-n-name')    || null,
          company:          v('bsh-n-company') || null,
          city:             v('bsh-n-city')    || null,
          plan:             v('bsh-n-plan')    || null,
          subscription_until: until,
          manager_name:     v('bsh-n-mgr')     || null,
          manager_contact:  v('bsh-n-mgrc')    || null,
          manager_whatsapp: v('bsh-n-mgrw')    || null
        }
      }).then(function (r) {
        btn.classList.remove('is-busy');
        btn.textContent = 'Create account';

        if (r.error) {
          msg.innerHTML = alertHtml('error', functionError(r));
          return;
        }
        if (r.data && r.data.warning) {
          msg.innerHTML = alertHtml('info', r.data.warning);
        }
        S.clients = null;
        loadClients().then(function () { go('#/admin'); });
      });

      function v(elId) { return document.getElementById(elId).value.trim(); }
    });
  }

  /* The function returns a readable reason in its body; surface that
     rather than the generic "Edge Function returned a non-2xx status". */
  function functionError(r) {
    var ctx = r.error && r.error.context;
    if (ctx && ctx.status === 404) {
      return 'The admin-create-client function is not deployed yet. ' +
             'Until it is, create the account in the Supabase Dashboard ' +
             '(Authentication → Users → Add user).';
    }
    if (r.data && r.data.error) return r.data.error;
    if (r.error && r.error.message) return r.error.message;
    return 'Could not create the account';
  }

  /* Experience for any profile, not just the signed-in one. */
  function expOf(p) { return (p && p.exp) || 0; }
  function levelOf(p) {
    var exp = expOf(p), lvl = 1;
    (S.levels || []).forEach(function (l) { if (exp >= l.min_exp && l.level > lvl) lvl = l.level; });
    return lvl;
  }

  /* ===================================================================
     ROUTING
     Every screen lives at a hash on this one page, so signing in and
     moving around never reloads and never leaves the block.
     =================================================================== */
  function pageUrl() {
    return window.location.origin + window.location.pathname;
  }

  function go(hash) {
    if (window.location.hash === hash) route();
    else window.location.hash = hash;
  }

  function route() {
    var h = (window.location.hash || '').replace(/^#/, '');

    /* A hash left over from the recovery email is not a route */
    if (h.indexOf('access_token') !== -1 || h.indexOf('error_description') !== -1) h = '';

    if (!h || h === '/') h = S.session ? '/hub' : '/login';

    if (h === '/login')  { if (S.session) return go('#/hub'); return screenLogin(); }
    if (h === '/reset')  { return screenReset(); }

    /* everything below is private */
    if (!S.session) return go('#/login');

    if (!S.loaded) {
      booting();
      return ensureData().then(route).catch(function (e) { fatal(humanError(e)); });
    }

    if (h === '/hub')     return screenHome();
    if (h === '/profile') return screenProfile();

    if (h === '/admin')     return screenAdminList();
    if (h === '/admin/new') return screenAdminNew();
    var mCli = /^\/admin\/c\/(.+)$/.exec(h);
    if (mCli) return screenAdminEdit(decodeURIComponent(mCli[1]));

    var mArt = /^\/kb\/a\/(.+)$/.exec(h);
    if (mArt) return screenArticle(decodeURIComponent(mArt[1]));

    var mCat = /^\/kb\/c\/(.+)$/.exec(h);
    if (mCat) return screenKb(decodeURIComponent(mCat[1]));

    if (h === '/kb') return screenKb(null);

    return go('#/hub');
  }

  /* ===================================================================
     START-UP
     =================================================================== */
  function loadLib(done) {
    if (window.supabase && window.supabase.createClient) return done();
    var tag = document.createElement('script');
    tag.src = LIB_URL;
    tag.onload = done;
    tag.onerror = function () { fatal('The supabase-js library failed to load. Check the connection and any ad blockers.'); };
    document.head.appendChild(tag);
  }

  function boot() {
    if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CONFIG.url) || !CONFIG.anonKey ||
        CONFIG.anonKey.indexOf('YOUR-ANON-KEY') !== -1) {
      fatal('The hub is not configured yet: fill in url and anonKey in CONFIG at the top of the block.');
      return;
    }

    /* A secret key in page source would hand every visitor full read and
       write access to the database, RLS included. Refuse to start. */
    if (/^sb_secret_/.test(CONFIG.anonKey) || /service_role/.test(CONFIG.anonKey)) {
      fatal('That is a SECRET key. Put the publishable (anon) key here instead — a secret key bypasses row level security and must never appear in page source. Rotate this key in Project Settings -> API.');
      return;
    }

    /* Note it before creating the client — supabase-js clears the hash */
    S.recovery = (window.location.hash || '').indexOf('type=recovery') !== -1;

    booting();

    loadLib(function () {
      sb = window.supabase.createClient(CONFIG.url, CONFIG.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });

      sb.auth.getSession().then(function (r) {
        S.session = r.data.session;
        window.addEventListener('hashchange', route);
        window.addEventListener('scroll', syncRail, { passive: true });
        window.addEventListener('resize', syncRail);
        window.addEventListener('resize', fitHost);
        window.addEventListener('load', fitHost);
        /* Turning the phone changes the height of everything; the event
           lands before the new layout, so measure on the far side of it. */
        window.addEventListener('orientationchange', function () {
          setTimeout(fitHost, 120);
        });
        if (S.session && S.recovery) return go('#/reset');
        route();
      }).catch(function (err) {
        fatal(humanError(err));
      });
    });
  }

  boot();
})();
</script>
