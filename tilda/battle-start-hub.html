<!-- =====================================================================
     BATTLE START — CLIENT HUB
     The whole hub in one file: styles, Supabase auth, router and every
     screen (sign in, password reset, home, knowledge base, article,
     profile).

     HOW TO INSTALL
       1. Tilda -> create one page, e.g. /hub
       2. Add a Zero Block -> "HTML" element (a T123 block works too)
       3. Paste this entire file
       4. Fill in CONFIG at the top of the <script> below
     Nothing goes into the site HEAD. This is the only block you need.
     ===================================================================== -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

/* ---------------------------------------------------------------------
   DESIGN TOKENS (taken from the avatararena.ru reference)
   Change them here and every screen follows.
   --------------------------------------------------------------------- */
.bsh {
  --bsh-pink:        #EC1E5E;
  --bsh-pink-dark:   #D01050;
  --bsh-pink-soft:   #FDE7EE;
  --bsh-blue:        #2F6BFF;
  --bsh-blue-dark:   #1E55E0;
  --bsh-blue-soft:   #E8EFFF;

  --bsh-navy:        #1F2A5A;   /* body text   */
  --bsh-navy-2:      #2D3C6E;   /* paragraphs  */
  --bsh-muted:       #8A93A6;   /* captions    */

  --bsh-bg:          #F6F7FB;   /* page ground */
  --bsh-surface:     #FFFFFF;   /* cards       */
  --bsh-soft:        #F1F3FA;   /* small tiles */
  --bsh-line:        #E6E9F2;   /* borders     */

  --bsh-radius-lg:   24px;
  --bsh-radius-md:   16px;
  --bsh-radius-sm:   12px;
  --bsh-pill:        999px;

  --bsh-shadow:      0 10px 40px rgba(31, 42, 90, .08);
  --bsh-shadow-soft: 0 4px 18px rgba(31, 42, 90, .06);
  --bsh-shadow-nav:  0 8px 30px rgba(31, 42, 90, .12);

  --bsh-font: 'Manrope', 'Golos Text', -apple-system, BlinkMacSystemFont,
              'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* ---------------------------------------------------------------------
   BASE. Everything is scoped to .bsh so it never clashes with Tilda.
   --------------------------------------------------------------------- */
.bsh, .bsh * { box-sizing: border-box; }
.bsh {
  font-family: var(--bsh-font);
  color: var(--bsh-navy);
  font-size: 16px;
  line-height: 1.55;
  background: var(--bsh-bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.bsh img { max-width: 100%; display: block; }

/* Links inherit colour by default: otherwise blue overrides card
   headings, the logo and the nav items. Blue is applied deliberately. */
.bsh a { color: inherit; text-decoration: none; cursor: pointer; }
.bsh-link, .bsh-prose a { color: var(--bsh-blue); }
.bsh-link:hover, .bsh-prose a:hover { color: var(--bsh-blue-dark); }

.bsh-wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 20px; }

/* ---------------------------------------------------------------------
   TYPOGRAPHY. The reference's signature move is the two-tone heading:
   <h2 class="bsh-h2"><span class="bsh-accent">Knowledge</span> base</h2>
   --------------------------------------------------------------------- */
.bsh-h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 0 0 14px; }
.bsh-h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.16; margin: 0 0 12px; }
.bsh-h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 8px; }
.bsh-accent { color: var(--bsh-pink); }
.bsh-lead   { font-size: 17px; color: var(--bsh-navy-2); margin: 0 0 8px; }
.bsh-muted  { color: var(--bsh-muted); }
.bsh-label  { font-size: 13px; font-weight: 500; color: var(--bsh-muted); }
.bsh-center { text-align: center; }

.bsh-section { padding: 32px 0; }

/* ---------------------------------------------------------------------
   PILLS AND BADGES
   --------------------------------------------------------------------- */
.bsh-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: var(--bsh-pill);
  background: var(--bsh-soft); color: var(--bsh-navy-2);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.bsh-badge--pink { background: var(--bsh-pink); color: #fff; }
.bsh-badge--blue { background: var(--bsh-blue-soft); color: var(--bsh-blue-dark); }

/* ---------------------------------------------------------------------
   BUTTONS
   --------------------------------------------------------------------- */
.bsh-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 26px; border-radius: var(--bsh-pill);
  border: 1px solid transparent; cursor: pointer;
  font-family: var(--bsh-font); font-size: 15px; font-weight: 700;
  line-height: 1; white-space: nowrap;
  transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
}
.bsh-btn:active { transform: translateY(1px); }
.bsh-btn[disabled], .bsh-btn.is-busy { opacity: .6; pointer-events: none; }
.bsh-btn--primary { background: var(--bsh-blue); color: #fff; box-shadow: 0 6px 18px rgba(47, 107, 255, .28); }
.bsh-btn--primary:hover { background: var(--bsh-blue-dark); color: #fff; }
.bsh-btn--accent { background: var(--bsh-pink); color: #fff; box-shadow: 0 6px 18px rgba(236, 30, 94, .26); }
.bsh-btn--accent:hover { background: var(--bsh-pink-dark); color: #fff; }
.bsh-btn--ghost { background: #fff; color: var(--bsh-navy); border-color: var(--bsh-line); }
.bsh-btn--ghost:hover { border-color: #C9D0E4; color: var(--bsh-navy); }
.bsh-btn--wide { width: 100%; }
.bsh-btn--sm   { padding: 10px 18px; font-size: 14px; }

/* ---------------------------------------------------------------------
   CARDS AND TILES
   --------------------------------------------------------------------- */
.bsh-card {
  background: var(--bsh-surface);
  border-radius: var(--bsh-radius-lg);
  box-shadow: var(--bsh-shadow);
  padding: 32px;
}
.bsh-card--flat { box-shadow: var(--bsh-shadow-soft); }
.bsh-card--pad-sm { padding: 22px; }

.bsh-tile { background: var(--bsh-soft); border-radius: var(--bsh-radius-sm); padding: 16px 18px; }
.bsh-tile__label { font-size: 13px; color: var(--bsh-muted); margin-bottom: 6px; }
.bsh-tile__value { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.bsh-tile__value--pink { color: var(--bsh-pink); }

/* ---------------------------------------------------------------------
   PILL HEADER (as on the reference: a white capsule over the content)
   --------------------------------------------------------------------- */
.bsh-nav {
  position: sticky; top: 14px; z-index: 900;
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: var(--bsh-pill);
  box-shadow: var(--bsh-shadow-nav);
  padding: 10px 12px 10px 22px;
  margin: 14px auto 0;
}
.bsh-nav__logo {
  font-size: 19px; font-weight: 800; font-style: italic;
  color: var(--bsh-pink); letter-spacing: -.02em; line-height: 1.05;
  text-transform: uppercase; margin-right: 6px; white-space: nowrap;
}
.bsh-nav__links { display: flex; align-items: center; gap: 4px; }
.bsh-nav__link {
  padding: 9px 14px; border-radius: var(--bsh-pill);
  font-size: 15px; font-weight: 600; white-space: nowrap;
}
.bsh-nav__link:hover { background: var(--bsh-soft); }
.bsh-nav__link.is-active { background: var(--bsh-soft); color: var(--bsh-pink); }
.bsh-nav__side { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.bsh-nav__user { display: flex; align-items: center; gap: 10px; padding-right: 4px; }
.bsh-nav__avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: var(--bsh-pink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
}
.bsh-nav__name { font-size: 14px; font-weight: 700; line-height: 1.2; }
.bsh-nav__company { font-size: 12px; color: var(--bsh-muted); line-height: 1.2; }

/* ---------------------------------------------------------------------
   TABS (category switcher, like the reference's 10 m2 / 400 m2 row)
   --------------------------------------------------------------------- */
.bsh-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
.bsh-tab {
  padding: 11px 20px; border-radius: var(--bsh-radius-sm);
  background: #fff; border: 1px solid var(--bsh-line);
  color: var(--bsh-navy); font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: var(--bsh-font); transition: all .18s ease;
}
.bsh-tab:hover { border-color: #C9D0E4; }
.bsh-tab.is-active { background: var(--bsh-pink); border-color: var(--bsh-pink); color: #fff; }

/* ---------------------------------------------------------------------
   FORMS
   --------------------------------------------------------------------- */
.bsh-field { margin-bottom: 16px; }
.bsh-field__label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--bsh-muted); margin-bottom: 7px;
}
textarea.bsh-input { min-height: 104px; resize: vertical; font-family: var(--bsh-font); }
.bsh-input {
  width: 100%; padding: 14px 16px;
  border: 1px solid var(--bsh-line); border-radius: var(--bsh-radius-sm);
  background: #fff; color: var(--bsh-navy);
  font-family: var(--bsh-font); font-size: 15px; line-height: 1.4;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.bsh-input::placeholder { color: #AEB6C7; }
.bsh-input:focus { outline: none; border-color: var(--bsh-blue); box-shadow: 0 0 0 4px rgba(47, 107, 255, .12); }
.bsh-input[readonly] { background: var(--bsh-soft); color: var(--bsh-muted); }

.bsh-alert { border-radius: var(--bsh-radius-sm); padding: 13px 16px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.bsh-alert--error { background: var(--bsh-pink-soft); color: var(--bsh-pink-dark); }
.bsh-alert--ok    { background: #E6F7EE; color: #12784A; }
.bsh-alert--info  { background: var(--bsh-blue-soft); color: var(--bsh-blue-dark); }

/* ---------------------------------------------------------------------
   LOADING AND EMPTY STATES
   --------------------------------------------------------------------- */
.bsh-skel {
  background: linear-gradient(90deg, #EEF1F8 25%, #F7F9FD 37%, #EEF1F8 63%);
  background-size: 400% 100%; animation: bsh-shimmer 1.3s ease infinite;
  border-radius: var(--bsh-radius-sm);
}
@keyframes bsh-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

.bsh-spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff;
  animation: bsh-spin .7s linear infinite;
}
@keyframes bsh-spin { to { transform: rotate(360deg); } }

.bsh-boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.bsh-boot__dot {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--bsh-line); border-top-color: var(--bsh-pink);
  animation: bsh-spin .7s linear infinite;
}
.bsh-empty { text-align: center; padding: 48px 20px; color: var(--bsh-muted); }
.bsh-empty__icon { font-size: 40px; margin-bottom: 12px; }

/* ---------------------------------------------------------------------
   SIGN IN / PASSWORD RESET
   --------------------------------------------------------------------- */
.bsh-auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.bsh-auth__box { width: 100%; max-width: 440px; }
.bsh-auth__logo { text-align: center; margin-bottom: 26px; }
.bsh-auth__logo b {
  font-size: 26px; font-weight: 800; font-style: italic; text-transform: uppercase;
  color: var(--bsh-pink); letter-spacing: -.02em; display: block; line-height: 1.05;
}
.bsh-auth__logo span { font-size: 13px; color: var(--bsh-muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.bsh-auth__foot { text-align: center; margin-top: 22px; font-size: 13px; color: var(--bsh-muted); line-height: 1.6; }
.bsh-auth__forgot { color: var(--bsh-blue); display: block; text-align: right; font-size: 13px; font-weight: 600; margin: -6px 0 20px; }

/* ---------------------------------------------------------------------
   HOME
   --------------------------------------------------------------------- */
.bsh-hero { padding: 44px 0 8px; }
.bsh-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.bsh-shortcut {
  display: block; background: #fff; border-radius: var(--bsh-radius-lg);
  box-shadow: var(--bsh-shadow); padding: 26px;
  transition: transform .18s ease, box-shadow .18s ease;
}
.bsh-shortcut:hover { transform: translateY(-3px); box-shadow: 0 16px 46px rgba(31,42,90,.12); }
.bsh-shortcut__icon {
  width: 46px; height: 46px; border-radius: 14px; margin-bottom: 16px;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  background: var(--bsh-pink-soft);
}
.bsh-shortcut--blue .bsh-shortcut__icon { background: var(--bsh-blue-soft); }
.bsh-shortcut--navy .bsh-shortcut__icon { background: var(--bsh-soft); }
.bsh-shortcut__title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
.bsh-shortcut__text { font-size: 14px; color: var(--bsh-muted); line-height: 1.5; }
.bsh-shortcut__meta { margin-top: 16px; }

.bsh-recent { margin-top: 34px; }
.bsh-recent__row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--bsh-line); }
.bsh-recent__row:first-of-type { border-top: none; }
.bsh-recent__row:hover { color: var(--bsh-pink); }
.bsh-recent__title { font-weight: 700; font-size: 16px; }
.bsh-recent__sum { font-size: 14px; color: var(--bsh-muted); margin-top: 2px; display: block; }
.bsh-recent__body { flex: 1; min-width: 0; }
.bsh-recent__arrow { color: var(--bsh-muted); font-size: 20px; flex: none; }

/* ---------------------------------------------------------------------
   EXPERIENCE. The client earns it by describing their arena; the bar and
   the task list exist to make the next step obvious and small.
   --------------------------------------------------------------------- */
.bsh-lvl {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: var(--bsh-pill);
  background: var(--bsh-pink-soft); color: var(--bsh-pink);
  font-size: 12px; font-weight: 800; letter-spacing: .02em; white-space: nowrap;
}
.bsh-xp { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 30px; align-items: stretch; }
.bsh-xp__side { display: flex; flex-direction: column; }
.bsh-xp__now { display: flex; align-items: baseline; gap: 12px; }
.bsh-xp__level { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.bsh-xp__count { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--bsh-muted); }
.bsh-xp__bar { height: 12px; border-radius: 999px; background: var(--bsh-soft); overflow: hidden; margin: 14px 0 10px; }
.bsh-xp__fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--bsh-pink), #FF6E9E);
  transition: width .7s cubic-bezier(.2, .7, .3, 1);
}
.bsh-xp__hint { font-size: 14px; color: var(--bsh-muted); }
.bsh-xp__perk { margin-top: auto; padding: 16px 18px; border-radius: var(--bsh-radius-sm); background: var(--bsh-pink-soft); }
.bsh-xp__perk b {
  display: block; font-size: 11px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--bsh-pink); margin-bottom: 6px;
}
.bsh-xp__perk span { font-size: 15px; font-weight: 700; color: var(--bsh-navy); line-height: 1.45; }

.bsh-tasks__title {
  font-size: 12px; font-weight: 800; color: var(--bsh-muted);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 14px;
}
.bsh-task {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--bsh-radius-sm);
  background: var(--bsh-soft); margin-bottom: 8px;
}
.bsh-task:hover { background: #E9EDF8; }
.bsh-task__label { font-size: 14px; font-weight: 700; }
.bsh-task__hint { font-size: 12px; color: var(--bsh-muted); display: block; margin-top: 1px; }
.bsh-task__pts { margin-left: auto; flex: none; font-size: 13px; font-weight: 800; color: var(--bsh-pink); }
.bsh-tasks__done { padding: 26px 18px; text-align: center; color: var(--bsh-muted); font-size: 14px; }

.bsh-pts {
  font-size: 11px; font-weight: 800; color: var(--bsh-pink);
  background: var(--bsh-pink-soft); padding: 2px 7px; border-radius: var(--bsh-pill);
}

/* locked article card: advertised, not readable */
.bsh-art--locked { background: #fff; border: 1px dashed #D6DCEC; }
.bsh-art--locked:hover { background: #fff; border-color: var(--bsh-pink); transform: none; }
.bsh-art--locked .bsh-art__title { opacity: .6; }
.bsh-art--locked .bsh-art__sum { opacity: .6; }
.bsh-art__lock { margin-top: auto; font-size: 14px; font-weight: 800; color: var(--bsh-pink); }

.bsh-locked { text-align: center; padding: 54px 26px; }
.bsh-locked__icon { font-size: 44px; margin-bottom: 14px; }
.bsh-locked__bar { max-width: 420px; margin: 24px auto 0; }

@media (max-width: 960px) { .bsh-xp { grid-template-columns: minmax(0, 1fr); gap: 24px; } }

/* ---------------------------------------------------------------------
   THE JOURNEY. The arena's real history rather than a score, so the
   track reads as a road: behind you it is solid, ahead it is faint, and
   the next stop pulses.
   --------------------------------------------------------------------- */
.bsh-path__track {
  display: flex; align-items: flex-start;
  overflow-x: auto; padding-bottom: 8px; margin: 0 -6px;
}
.bsh-path__track::-webkit-scrollbar { height: 6px; }
.bsh-path__track::-webkit-scrollbar-thumb { background: var(--bsh-line); border-radius: 999px; }

.bsh-path__step { flex: 1 0 132px; position: relative; text-align: center; padding: 0 6px; }
.bsh-path__step::before,
.bsh-path__step::after {
  content: ''; position: absolute; top: 20px; height: 3px; background: var(--bsh-line);
}
.bsh-path__step::before { left: 0; right: 50%; }
.bsh-path__step::after  { left: 50%; right: 0; }
.bsh-path__step:first-child::before,
.bsh-path__step:last-child::after { display: none; }
.bsh-path__step.is-done::before,
.bsh-path__step.is-done::after,
.bsh-path__step.is-next::before { background: var(--bsh-pink); }

.bsh-path__dot {
  position: relative; z-index: 1;
  width: 42px; height: 42px; margin: 0 auto 12px;
  border-radius: 50%; border: 4px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; background: var(--bsh-soft);
}
.bsh-path__step.is-done .bsh-path__dot { background: var(--bsh-pink); }
.bsh-path__step.is-next .bsh-path__dot {
  background: #fff; box-shadow: 0 0 0 3px var(--bsh-pink);
  animation: bsh-pulse 2.2s ease-in-out infinite;
}
@keyframes bsh-pulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--bsh-pink); }
  50%      { box-shadow: 0 0 0 8px rgba(236, 30, 94, .16); }
}
.bsh-path__step.is-future { opacity: .45; }

.bsh-path__title { font-size: 13px; font-weight: 700; line-height: 1.3; }
.bsh-path__date  { font-size: 12px; color: var(--bsh-muted); margin-top: 4px; }
.bsh-path__next {
  margin-top: 24px; padding: 16px 18px;
  border-radius: var(--bsh-radius-sm); background: var(--bsh-pink-soft);
}
.bsh-path__next b {
  display: block; font-size: 11px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--bsh-pink); margin-bottom: 6px;
}
.bsh-path__next span { font-size: 15px; font-weight: 700; color: var(--bsh-navy); }
.bsh-path__next em { display: block; font-style: normal; font-size: 13px; color: var(--bsh-muted); margin-top: 3px; }

/* ---------------------------------------------------------------------
   ADMINISTRATION. Every value here is typed in by hand — the plan is
   whatever was actually agreed, not an entry from a list.
   --------------------------------------------------------------------- */
.bsh-adm { padding: 44px 0 72px; }
.bsh-adm__bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.bsh-adm__search { flex: 1; min-width: 220px; max-width: 360px; }
.bsh-adm__row {
  display: flex; align-items: center; gap: 18px;
  padding: 15px 0; border-top: 1px solid var(--bsh-line);
}
.bsh-adm__row:first-of-type { border-top: none; }
.bsh-adm__row:hover { color: var(--bsh-pink); }
.bsh-adm__who { flex: 1; min-width: 0; }
.bsh-adm__name { font-weight: 700; font-size: 15px; }
.bsh-adm__mail { font-size: 13px; color: var(--bsh-muted); display: block; margin-top: 1px; }
.bsh-adm__cell { flex: none; width: 150px; font-size: 13px; color: var(--bsh-navy-2); }
.bsh-adm__cell b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--bsh-muted); margin-bottom: 3px; font-weight: 700; }
.bsh-adm__arrow { flex: none; color: var(--bsh-muted); font-size: 20px; }
.bsh-adm__group { margin: 30px 0 18px; }
.bsh-adm__group h3 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
.bsh-adm__group p { font-size: 13px; color: var(--bsh-muted); margin: 0; }

.bsh-badge--ok   { background: #E6F7EE; color: #12784A; }
.bsh-badge--warn { background: #FFF1E0; color: #A15600; }
.bsh-badge--off  { background: var(--bsh-soft); color: var(--bsh-muted); }

.bsh-sub { display: grid; gap: 4px; }
.bsh-sub__plan { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.bsh-sub__dates { font-size: 13px; color: var(--bsh-muted); }

@media (max-width: 860px) {
  .bsh-adm__row { flex-wrap: wrap; gap: 10px 18px; }
  .bsh-adm__who { flex-basis: 100%; }
  .bsh-adm__cell { width: auto; min-width: 110px; }
}

/* ---------------------------------------------------------------------
   KNOWLEDGE BASE
   --------------------------------------------------------------------- */
.bsh-kb { padding: 44px 0 72px; }
.bsh-kb__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

}

<div class="bsh" id="bsh-app">
  <div class="bsh-boot"><div class="bsh-boot__dot"></div></div>
</div>

<script>
(function () {
  'use strict';

  /* ===================================================================
     CONFIG
     Supabase Dashboard -> Project Settings -> API
       url     -> "Project URL"
       anonKey -> the PUBLIC key. Both formats work: the current
                  "publishable" key (sb_publishable_...) and the legacy
                  anon JWT (eyJ...).
     That key is meant to be public and is safe in page source: access is
     limited by RLS policies, not by hiding the key.
     Never put the secret key here (sb_secret_... or service_role) — it
     bypasses RLS entirely. The guard below refuses to start if you do.
     =================================================================== */
  var CONFIG = {
    url:     'https://sbyhcqjthddqbgpwmoxi.supabase.co',
    anonKey: 'sb_publishable_ci3Df8P-Eqx45sH_CdR3xg_ZpHFTBAf',
    brand:   'Battle Start'
  };

  var LIB_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';

  var app = document.getElementById('bsh-app');
  var sb  = null;

  var S = {
    session:  null,   /* current Supabase session      */
    profile:  null,   /* the client's profiles row     */
    cats:     null,   /* knowledge base categories     */
    arts:     null,   /* catalogue rows, locked included */
    levels:   null,   /* level thresholds and perks    */
    rules:    null,   /* what earns experience         */
    clients:  null,   /* every profile, administrators only */
    msTypes:  null,   /* the network-wide path         */
    msMine:   null,   /* milestones this arena reached */
    kbQuery:  '',     /* current search text           */
    recovery: false,  /* arrived from a recovery email */
    loaded:   false   /* profile + index fetched        */
  };

  /* ===================================================================
     HELPERS
     =================================================================== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function initials(name, email) {
    var src = (name || '').trim();
    if (src) {
      var parts = src.split(/\s+/);
      return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }
    return (email || '?').slice(0, 2).toUpperCase();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return '—'; }
  }

  /* Supabase errors rewritten for people */
  var ERRORS = {
    'Invalid login credentials':                'Wrong email or password',
    'Email not confirmed':                      'This email is not confirmed yet. Contact your manager.',
    'User not found':                           'No such user',
    'Password should be at least 6 characters': 'Use at least 6 characters',
    'New password should be different from the old password': 'The new password must differ from the old one',
    'Email rate limit exceeded':                'Too many emails sent. Try again in a few minutes.',
    'For security purposes, you can only request this after 60 seconds':
                                                'You can try again in a minute'
  };
  function humanError(err) {
    if (!err) return 'Something went wrong';
    var msg = err.message || String(err);
    if (ERRORS[msg]) return ERRORS[msg];
    for (var key in ERRORS) { if (msg.indexOf(key) === 0) return ERRORS[key]; }
    if (/fetch|network|Failed to fetch/i.test(msg)) return 'No connection to the server. Check your internet.';
    return msg;
  }

  function alertHtml(kind, text) {
    return '<div class="bsh-alert bsh-alert--' + kind + '">' + esc(text) + '</div>';
  }

  /* -------------------------------------------------------------------
     Small Markdown renderer for knowledge base articles.
     HTML is escaped first, so an article cannot inject markup.
     Supported: headings, lists, tables, quotes, code, links, images,
     bold/italic and horizontal rules.
     ------------------------------------------------------------------- */
  function markdown(src) {
    if (!src) return '';
    var lines = esc(src).replace(/\r\n/g, '\n').split('\n');
    var out = [], i = 0;

    function inline(s) {
      return s
        .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    }
    function cells(line) {
      return line.split('|').map(function (c) { return c.trim(); })
        .filter(function (c, idx, arr) { return !(c === '' && (idx === 0 || idx === arr.length - 1)); });
    }

    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      /* horizontal rule */
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* headings */
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) {
        var lvl = Math.min(h[1].length + 1, 6);
        out.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>');
        i++; continue;
      }

      /* table */
      if (line.indexOf('|') !== -1 && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1] || '')) {
        var head = cells(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1) { rows.push(cells(lines[i])); i++; }
        out.push('<div class="bsh-prose__scroll"><table><thead><tr>' +
          head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>');
        continue;
      }

      /* blockquote */
      if (/^>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, '')); i++; }
        out.push('<blockquote>' + inline(quote.join(' ')) + '</blockquote>');
        continue;
      }

      /* ordered list */
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++;
        }
        out.push('<ol>' + ol.join('') + '</ol>');
        continue;
      }

      /* unordered list */
      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++;
        }
        out.push('<ul>' + ul.join('') + '</ul>');
        continue;
      }

      /* paragraph */
      var para = [];
      while (i < lines.length && lines[i].trim() &&
             !/^(#{1,4}\s|>|\s*[-*+]\s|\s*\d+\.\s)/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  /* ===================================================================
     DATA
     =================================================================== */
  function loadProfile() {
    /* Filter explicitly: an administrator's policy returns every profile,
       so relying on RLS to leave exactly one row would break for them. */
    return sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle().then(function (r) {
      if (r.error) throw r.error;
      S.profile = r.data;
      return S.profile;
    });
  }

  /* Private screens need the profile and the knowledge base index.
     Fetching them here rather than at each entry point means no route
     can arrive at a screen with half its data missing. */
  function ensureData() {
    if (S.loaded) return Promise.resolve();
    return Promise.all([loadProfile(), loadIndex()]).then(function () { S.loaded = true; });
  }

  function loadIndex() {
    if (S.cats && S.arts && S.levels && S.rules && S.msTypes) return Promise.resolve();
    return Promise.all([
      sb.from('kb_categories').select('*').eq('is_published', true).order('sort_order', { ascending: true }),
      /* kb_catalog, not kb_articles: it lists locked material too, so it
         can be advertised, but it carries no article body. */
      sb.from('kb_catalog').select('*').order('sort_order', { ascending: true }),
      sb.from('levels').select('*').order('min_exp', { ascending: true }),
      sb.from('exp_rules').select('*').order('sort_order', { ascending: true }),
      sb.from('milestone_types').select('*').order('sort_order', { ascending: true }),
      sb.from('client_milestones').select('*').eq('profile_id', S.session.user.id)
    ]).then(function (res) {
      for (var i = 0; i < res.length; i++) { if (res[i].error) throw res[i].error; }
      S.cats    = res[0].data || [];
      S.arts    = res[1].data || [];
      S.levels  = res[2].data || [];
      S.rules   = res[3].data || [];
      S.msTypes = res[4].data || [];
      S.msMine  = res[5].data || [];
    });
  }

  /* -------------------------------------------------------------------
     Where the client stands. exp comes from the database, which computes
     it from the profile — the browser only presents it.
     ------------------------------------------------------------------- */
  function levelInfo() {
    var exp = (S.profile && S.profile.exp) || 0;
    var ls  = (S.levels || []).slice().sort(function (a, b) { return a.min_exp - b.min_exp; });
    if (!ls.length) return { exp: exp, level: 1, title: '', next: null, toNext: 0, pct: 100 };

    var cur = ls[0], next = null;
    for (var i = 0; i < ls.length; i++) {
      if (exp >= ls[i].min_exp) cur = ls[i];
      else { next = ls[i]; break; }
    }
    var span = next ? (next.min_exp - cur.min_exp) : 0;
    return {
      exp: exp,
      level: cur.level,
      title: cur.title,
      next: next,
      toNext: next ? next.min_exp - exp : 0,
      pct: next ? Math.max(3, Math.min(100, Math.round((exp - cur.min_exp) / span * 100))) : 100
    };
  }

  /* Fields still worth filling in, richest first. */
  function pendingTasks() {
    var p = S.profile || {};
    return (S.rules || []).filter(function (r) {
      var v = (p[r.field] == null ? '' : String(p[r.field])).trim();
      return v.length < (r.min_length || 1);
    });
  }

  function catById(id) {
    for (var i = 0; i < (S.cats || []).length; i++) { if (S.cats[i].id === id) return S.cats[i]; }
    return null;
  }
  function catBySlug(slug) {
    for (var i = 0; i < (S.cats || []).length; i++) { if (S.cats[i].slug === slug) return S.cats[i]; }
    return null;
  }

  /* ===================================================================
     RENDERING
     =================================================================== */
  function paint(html) { app.innerHTML = html; }

  function booting() {
    paint('<div class="bsh-boot"><div class="bsh-boot__dot"></div></div>');
  }

  function fatal(text) {
    paint('<div class="bsh-wrap bsh-section"><div class="bsh-card">' +
          alertHtml('error', text) + '</div></div>');
  }

  /* The pill header, shown on every private screen */
  function header(active) {
    var p = S.profile || {};
    var email = S.session ? S.session.user.email : '';
    var links = [
      { hash: '#/hub',     label: 'Hub',            key: 'hub' },
      { hash: '#/kb',      label: 'Knowledge base', key: 'kb' },
      { hash: '#/profile', label: 'Profile',        key: 'profile' }
    ];
    if (isAdmin()) links.push({ hash: '#/admin', label: 'Clients', key: 'admin' });

    return '<div class="bsh-wrap"><nav class="bsh-nav">' +
      '<a class="bsh-nav__logo" href="#/hub">Battle<br>Start</a>' +
      '<div class="bsh-nav__links">' +
        links.map(function (l) {
          return '<a class="bsh-nav__link' + (l.key === active ? ' is-active' : '') +
                 '" href="' + l.hash + '">' + l.label + '</a>';
        }).join('') +
      '</div>' +
      '<div class="bsh-nav__side">' +
        (S.levels ? '<a class="bsh-lvl" href="#/hub" title="Experience">LVL ' +
                    levelInfo().level + ' · ' + levelInfo().exp + ' EXP</a>' : '') +
        '<div class="bsh-nav__user">' +
          '<div class="bsh-nav__avatar">' + esc(initials(p.full_name, email)) + '</div>' +
          '<div>' +
            '<div class="bsh-nav__name">' + esc(p.full_name || email) + '</div>' +
            '<div class="bsh-nav__company">' + esc(p.company || p.city || email) + '</div>' +
          '</div>' +
        '</div>' +
        '<button class="bsh-btn bsh-btn--ghost bsh-btn--sm" id="bsh-logout" type="button">Sign out</button>' +
      '</div>' +
    '</nav></div>';
  }

  function bindLogout() {
    var btn = document.getElementById('bsh-logout');
    if (!btn) return;
    btn.addEventListener('click', function () {
      btn.classList.add('is-busy');
      btn.textContent = 'Signing out…';
      sb.auth.signOut().then(function () {
        S.session = null; S.profile = null; S.loaded = false;
        S.cats = null; S.arts = null;
        go('#/login');
      });
    });
  }

  /* ===================================================================
     SCREEN: SIGN IN
     =================================================================== */
  function screenLogin() {
    paint(
      '<div class="bsh-auth"><div class="bsh-auth__box">' +
        '<div class="bsh-auth__logo"><b>' + esc(CONFIG.brand) + '</b><span>Client hub</span></div>' +
        '<div class="bsh-card">' +
          '<h1 class="bsh-h2 bsh-center" style="margin-bottom:6px">' +
            '<span class="bsh-accent">Sign in</span> to the hub</h1>' +
          '<p class="bsh-lead bsh-center bsh-muted" style="font-size:15px;margin-bottom:26px">' +
            'Access is granted by invitation</p>' +
          '<div id="bsh-msg"></div>' +
          '<form id="bsh-form" novalidate>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-email">Email</label>' +
              '<input class="bsh-input" id="bsh-email" type="email" autocomplete="username" placeholder="you@example.com">' +
            '</div>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-pass">Password</label>' +
              '<input class="bsh-input" id="bsh-pass" type="password" autocomplete="current-password" placeholder="••••••••">' +
            '</div>' +
            '<a class="bsh-auth__forgot" href="#" id="bsh-forgot">Forgot your password?</a>' +
            '<button class="bsh-btn bsh-btn--primary bsh-btn--wide" type="submit" id="bsh-submit">Sign in</button>' +
          '</form>' +
        '</div>' +
        '<p class="bsh-auth__foot">No access yet? Message your ' + esc(CONFIG.brand) + ' manager —<br>' +
          'accounts are created by hand.</p>' +
      '</div></div>'
    );

    var form   = document.getElementById('bsh-form');
    var btn    = document.getElementById('bsh-submit');
    var msg    = document.getElementById('bsh-msg');
    var email  = document.getElementById('bsh-email');
    var pass   = document.getElementById('bsh-pass');
    var forgot = document.getElementById('bsh-forgot');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.innerHTML = '';

      var mail = email.value.trim(), pwd = pass.value;
      if (!mail || !pwd) { msg.innerHTML = alertHtml('error', 'Enter your email and password'); return; }

      btn.classList.add('is-busy');
      btn.innerHTML = '<span class="bsh-spinner"></span>Signing in…';

      sb.auth.signInWithPassword({ email: mail, password: pwd }).then(function (r) {
        if (r.error) {
          btn.classList.remove('is-busy');
          btn.textContent = 'Sign in';
          msg.innerHTML = alertHtml('error', humanError(r.error));
          pass.value = '';
          pass.focus();
          return;
        }
        S.session = r.data.session;
        S.loaded  = false;
        go('#/hub');
      });
    });

    forgot.addEventListener('click', function (e) {
      e.preventDefault();
      msg.innerHTML = '';

      var mail = email.value.trim();
      if (!mail) {
        msg.innerHTML = alertHtml('info', 'Type your email in the field above, then click "Forgot your password?" again');
        email.focus();
        return;
      }

      forgot.textContent = 'Sending…';
      sb.auth.resetPasswordForEmail(mail, { redirectTo: pageUrl() }).then(function (r) {
        forgot.textContent = 'Forgot your password?';
        msg.innerHTML = r.error
          ? alertHtml('error', humanError(r.error))
          : alertHtml('ok', 'A reset link is on its way to ' + mail);
      });
    });
  }

  /* ===================================================================
     SCREEN: SET A NEW PASSWORD
     Reached from the recovery email. The link carries a token in the
     URL hash, which supabase-js consumes on start-up.
     =================================================================== */
  function screenReset() {
    paint(
      '<div class="bsh-auth"><div class="bsh-auth__box">' +
        '<div class="bsh-card">' +
          '<h1 class="bsh-h2 bsh-center" style="margin-bottom:6px">' +
            '<span class="bsh-accent">New</span> password</h1>' +
          '<p class="bsh-lead bsh-center bsh-muted" style="font-size:15px;margin-bottom:26px">' +
            'Choose a password for the hub</p>' +
          '<div id="bsh-msg"></div>' +
          '<form id="bsh-form" novalidate>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-p1">Password</label>' +
              '<input class="bsh-input" id="bsh-p1" type="password" autocomplete="new-password" placeholder="At least 8 characters">' +
            '</div>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-p2">Repeat password</label>' +
              '<input class="bsh-input" id="bsh-p2" type="password" autocomplete="new-password" placeholder="Once more">' +
            '</div>' +
            '<button class="bsh-btn bsh-btn--primary bsh-btn--wide" type="submit" id="bsh-submit">Save password</button>' +
          '</form>' +
        '</div>' +
        '<p class="bsh-center" style="margin-top:20px;font-size:13px">' +
          '<a class="bsh-link" href="#/login">Back to sign in</a></p>' +
      '</div></div>'
    );

    var form = document.getElementById('bsh-form');
    var btn  = document.getElementById('bsh-submit');
    var msg  = document.getElementById('bsh-msg');
    var p1   = document.getElementById('bsh-p1');
    var p2   = document.getElementById('bsh-p2');

    if (!S.session) {
      msg.innerHTML = alertHtml('error', 'This link is invalid or has expired. Request a new one from the sign-in page.');
      form.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });
      return;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.innerHTML = '';

      if (p1.value.length < 8)   { msg.innerHTML = alertHtml('error', 'Use at least 8 characters'); return; }
      if (p1.value !== p2.value) { msg.innerHTML = alertHtml('error', 'The passwords do not match'); return; }

      btn.classList.add('is-busy');
      btn.innerHTML = '<span class="bsh-spinner"></span>Saving…';

      sb.auth.updateUser({ password: p1.value }).then(function (r) {
        if (r.error) {
          btn.classList.remove('is-busy');
          btn.textContent = 'Save password';
          msg.innerHTML = alertHtml('error', humanError(r.error));
          return;
        }
        msg.innerHTML = alertHtml('ok', 'Password saved. Opening the hub…');
        setTimeout(function () { go('#/hub'); }, 1200);
      });
    });
  }

  function isAdmin() { return !!(S.profile && S.profile.role === 'admin'); }

  /* wa.me wants digits only, country code included. */
  function waLink(num) {
    var d = String(num == null ? '' : num).replace(/\D/g, '');
    return d ? 'https://wa.me/' + d : null;
  }

  /* The manager block, used on the home screen and in the profile. */
  function managerBlock(p) {
    if (!p || !p.manager_name) return '<span class="bsh-muted">No manager assigned yet.</span>';
    var wa = waLink(p.manager_whatsapp);
    return '<b style="color:var(--bsh-navy)">' + esc(p.manager_name) + '</b>' +
      (p.manager_contact ? '<br><span class="bsh-muted">' + esc(p.manager_contact) + '</span>' : '') +

          'href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>'
        : '');
  }

  /* Dates are typed by hand, so both 2026-03-01 and 01.03.2026 are
     accepted and normalised. Returns null for empty, false for nonsense. */
  function parseDate(str) {
    var v = (str || '').trim();
    if (!v) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    var m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(v);
    if (m) {
      var d = ('0' + m[1]).slice(-2), mo = ('0' + m[2]).slice(-2);
      return m[3] + '-' + mo + '-' + d;
    }
    return false;
  }

  function fmtDay(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB',
        { day: '2-digit', month: 'short', year: 'numeric' });
    } catch (e) { return iso; }
  }

  /* What to say about a client's subscription. */
  function subInfo(p) {
    if (!p || !p.subscription_until) {
      return { kind: 'off', label: 'No subscription', days: null };
    }
    var end   = new Date(p.subscription_until + 'T23:59:59');
    var days  = Math.ceil((end - new Date()) / 86400000);
    if (days < 0)  return { kind: 'expired', label: 'Expired', days: days };
    if (days <= 14) return { kind: 'soon',   label: days + ' days left', days: days };
    return { kind: 'active', label: 'Active', days: days };
  }

  function subBadge(p) {
    var i = subInfo(p);
    var cls = i.kind === 'active' ? 'ok' : i.kind === 'soon' ? 'warn' : i.kind === 'expired' ? 'pink' : 'off';
    return '<span class="bsh-badge bsh-badge--' + cls + '">' + esc(i.label) + '</span>';
  }

  /* Experience needed to reach a given level. */
  function expForLevel(n) {
    var row = (S.levels || []).filter(function (l) { return l.level === n; })[0];
    return row ? row.min_exp : 0;
  }

  /* The journey: milestones behind, the next one ahead. Reached dates are
     supplied by an administrator — Battle Start confirming each step is
     what gives the path its weight. */
  function journeyCard(reached, types) {
    types = types || S.msTypes || [];
    if (!types.length) return '';

    var byslug = {};
    (reached || []).forEach(function (m) { byslug[m.milestone_slug] = m; });

    var nextIdx = -1;
    for (var i = 0; i < types.length; i++) {
      if (!byslug[types[i].slug]) { nextIdx = i; break; }
    }

    var steps = types.map(function (t, i) {
      var got = byslug[t.slug];
      var cls = got ? 'is-done' : (i === nextIdx ? 'is-next' : 'is-future');
      return '<div class="bsh-path__step ' + cls + '">' +
        '<div class="bsh-path__dot">' + (got ? '✓' : esc(t.icon || '')) + '</div>' +
        '<div class="bsh-path__title">' + esc(t.title) + '</div>' +
        '<div class="bsh-path__date">' + (got ? esc(fmtDay(got.reached_on)) : '—') + '</div>' +
      '</div>';
    }).join('');

    var next = nextIdx >= 0 ? types[nextIdx] : null;
    var done = Object.keys(byslug).length;

    return '<section class="bsh-section">' +
      '<h2 class="bsh-h2"><span class="bsh-accent">Your</span> journey</h2>' +
      '<p class="bsh-lead" style="margin-bottom:20px">' +
        (done
          ? done + ' of ' + types.length + ' milestones behind you.'
          : 'Your manager marks each milestone as you pass it.') +
      '</p>' +
      '<div class="bsh-card">' +
        '<div class="bsh-path__track">' + steps + '</div>' +
        (next
          ? '<div class="bsh-path__next"><b>Next</b><span>' + esc(next.title) + '</span>' +
            (next.description ? '<em>' + esc(next.description) + '</em>' : '') + '</div>'
          : '<div class="bsh-path__next"><b>Complete</b><span>' +
            'You have walked the whole path. Not many arenas get here.</span></div>') +
      '</div>' +
    '</section>';
  }

  /* The progress card: where the client stands, and the smallest next
     step towards the thing they cannot read yet. */
  function xpCard() {
    var L     = levelInfo();
    var tasks = pendingTasks().slice(0, 5);
    var perk  = L.next && L.next.perk;

    return '<section class="bsh-section"><div class="bsh-card"><div class="bsh-xp">' +
      '<div class="bsh-xp__side">' +
        '<div class="bsh-xp__now">' +
          '<span class="bsh-lvl">LVL ' + L.level + '</span>' +
          '<span class="bsh-xp__level">' + esc(L.title) + '</span>' +
          '<span class="bsh-xp__count">' + L.exp + ' EXP</span>' +
        '</div>' +
        '<div class="bsh-xp__bar"><div class="bsh-xp__fill" style="width:' + L.pct + '%"></div></div>' +
        '<div class="bsh-xp__hint">' +
          (L.next
            ? L.toNext + ' EXP to level ' + L.next.level + ' — ' + esc(L.next.title)
            : 'Top level reached. Your profile is complete.') +
        '</div>' +
        (perk
          ? '<div class="bsh-xp__perk">' +
              '<b>Waiting at level ' + L.next.level + '</b>' +
              '<span>' + esc(perk) + '</span>' +
            '</div>'
          : '') +
      '</div>' +
      '<div>' +
        '<div class="bsh-tasks__title">Earn experience</div>' +
        (tasks.length
          ? tasks.map(function (t) {
              return '<a class="bsh-task" href="#/profile">' +
                '<span>' +
                  '<span class="bsh-task__label">' + esc(t.label) + '</span>' +
                  (t.hint ? '<span class="bsh-task__hint">' + esc(t.hint) + '</span>' : '') +
                '</span>' +
                '<span class="bsh-task__pts">+' + t.points + '</span>' +
              '</a>';
            }).join('')
          : '<div class="bsh-tasks__done">Everything is filled in. Nothing left to earn.</div>') +
      '</div>' +
    '</div></div></section>';
  }

  function screenArticle(slug) {
    paint(header('kb') +
      '<div class="bsh-wrap bsh-kb"><div class="bsh-card">' +
        '<div class="bsh-skel" style="height:30px;width:60%;margin-bottom:20px"></div>' +

      '</div></div>');
    bindLogout();

    var article = null;

    sb.from('kb_articles').select('*').eq('slug', slug).eq('is_published', true).maybeSingle()
      .then(function (r) {
        if (r.error) throw r.error;
        if (!r.data) {
          /* RLS returns nothing for an article above the client's level.
             The catalogue still knows it exists, so say what it is and
             what it costs rather than pretending it is missing. */
          var teaser = (S.arts || []).filter(function (x) { return x.slug === slug; })[0];
          if (teaser && teaser.unlocked === false) lockedScreen(teaser);
          else notFound();
          return null;
        }
        article = r.data;
        return sb.from('kb_files').select('*').eq('article_id', article.id)
          .order('sort_order', { ascending: true });
      })
      .then(function (f) {
        if (!article) return;
        draw(article, (f && f.data) || []);
      })
      .catch(function (err) {
        paint(header('kb') + '<div class="bsh-wrap bsh-kb"><div class="bsh-card">' +
              alertHtml('error', humanError(err)) + '</div></div>');
        bindLogout();
      });

        '<div class="bsh-wrap bsh-kb">' +

            (files.length

                files.map(function (f) {
                  return '<a class="bsh-file" href="' + esc(f.url) + '" target="_blank" rel="noopener">' +
                    '<span class="bsh-file__icon">' + (icons[f.kind] || icons.file) + '</span>' +

  /* ===================================================================
     SCREEN: PROFILE
     =================================================================== */
  function screenProfile() {
    var p = S.profile || {};
    var email = S.session.user.email;

    /* An unfilled field advertises what it is worth; once earned the
       badge disappears, so the form always shows what is still on offer. */
    function pts(name) {
      var r = (S.rules || []).filter(function (x) { return x.field === name; })[0];
      if (!r) return '';
      var v = (p[name] == null ? '' : String(p[name])).trim();
      if (v.length >= (r.min_length || 1)) return '';
      return '<span class="bsh-pts">+' + r.points + ' EXP</span>';
    }

    function field(id, name, label, type, ph) {
      return '<div class="bsh-field">' +
        '<label class="bsh-field__label" for="' + id + '">' + label + pts(name) + '</label>' +
        '<input class="bsh-input" id="' + id + '" type="' + (type || 'text') +
          '" value="' + esc(p[name] || '') + '" placeholder="' + esc(ph || '') + '">' +
      '</div>';
    }

    function area(id, name, label, ph) {
      return '<div class="bsh-field">' +
        '<label class="bsh-field__label" for="' + id + '">' + label + pts(name) + '</label>' +

      save.classList.add('is-busy');
      save.innerHTML = '<span class="bsh-spinner"></span>Saving…';

      var before = levelInfo();

      /* exp is a generated column — it is never sent, only read back. */
      var patch = {
        id:               S.session.user.id,
        full_name:        val('bsh-f-name'),
        company:          val('bsh-f-company'),
        city:             val('bsh-f-city'),

        social_telegram:  val('bsh-f-tgch'),

      };

        save.textContent = 'Save';

        S.profile = r.data;
        var after  = levelInfo();
        var gained = after.exp - before.exp;

        /* A new level changes what the catalogue unlocks, so it is refetched. */
        var done = function () {
          screenProfile();
          var box = document.getElementById('bsh-msg');
          if (after.level > before.level) {
            box.innerHTML = alertHtml('ok',
              'Level ' + after.level + ' reached — ' + after.title + '. ' +
              'New material is open in the knowledge base.');
          } else if (gained > 0) {
            box.innerHTML = alertHtml('ok',
              'Saved. +' + gained + ' EXP' +
              (after.next ? ' — ' + after.toNext + ' to level ' + after.next.level : ''));
          } else {
            box.innerHTML = alertHtml('ok', 'Details saved');
          }
        };

        if (after.level !== before.level) { S.arts = null; loadIndex().then(done, done); }
        else done();
      });
    });

    document.getElementById('bsh-cancel').addEventListener('click', function () { screenProfile(); });

    document.getElementById('bsh-pw-form').addEventListener('submit', function (e) {
      e.preventDefault();
      pwMsg.innerHTML = '';
      var p1 = document.getElementById('bsh-pw1');
      var p2 = document.getElementById('bsh-pw2');
      var btn = document.getElementById('bsh-pw-save');

      if (p1.value.length < 8)   { pwMsg.innerHTML = alertHtml('error', 'Use at least 8 characters'); return; }
      if (p1.value !== p2.value) { pwMsg.innerHTML = alertHtml('error', 'The passwords do not match'); return; }

      btn.classList.add('is-busy');
      btn.textContent = 'Updating…';

      sb.auth.updateUser({ password: p1.value }).then(function (r) {
        btn.classList.remove('is-busy');
        btn.textContent = 'Update password';
        if (r.error) { pwMsg.innerHTML = alertHtml('error', humanError(r.error)); return; }
        p1.value = ''; p2.value = '';
        pwMsg.innerHTML = alertHtml('ok', 'Password updated');
      });
    });

  function loadClients(force) {
    if (S.clients && !force) return Promise.resolve();
    return sb.from('profiles').select('*').order('created_at', { ascending: false })
      .then(function (r) {
        if (r.error) throw r.error;
        S.clients = r.data || [];
      });

    return '<div class="bsh-adm__group"><h3>' + title + '</h3>' +
           (note ? '<p>' + note + '</p>' : '') + '</div>';

  /* flash: markup shown in the message slot once the form is on screen.
     The render is asynchronous, so writing into #bsh-msg from the caller
     would be wiped by the repaint that follows. */

    if (!isAdmin()) return go('#/hub');

    return Promise.all([
      loadClients(),
      sb.from('client_milestones').select('*').eq('profile_id', id)
    ]).then(function (res) {
      if (res[1] && res[1].error) throw res[1].error;
      var ms = (res[1] && res[1].data) || [];
      var msBySlug = {};
      ms.forEach(function (m) { msBySlug[m.milestone_slug] = m; });

      var c = (S.clients || []).filter(function (x) { return x.id === id; })[0];
      if (!c) {
        paint(header('admin') + '<div class="bsh-wrap bsh-adm">' +
          '<a class="bsh-back" href="#/admin">← All clients</a>' +
          '<div class="bsh-card"><div class="bsh-empty">' +
          '<div class="bsh-empty__icon">🤷</div>No such client</div></div></div>');
        bindLogout();
        return;
      }

      paint(header('admin') +
        '<div class="bsh-wrap bsh-adm">' +
          '<a class="bsh-back" href="#/admin">← All clients</a>' +
          '<div class="bsh-card" style="max-width:860px">' +
            '<div class="bsh-profile__head">' +
              '<div class="bsh-profile__ava">' + esc(initials(c.full_name, c.email)) + '</div>' +
              '<div>' +
                '<div class="bsh-profile__name">' + esc(c.full_name || 'Unnamed') + '</div>' +
                '<div class="bsh-profile__mail">' + esc(c.email || '') + ' · ' +
                  'Level ' + levelOf(c) + ' · ' + expOf(c) + ' EXP</div>' +
              '</div>' +
              '<div style="margin-left:auto">' + subBadge(c) + '</div>' +
            '</div>' +

            '<div id="bsh-msg"></div>' +

            '<form id="bsh-adm-form">' +

              group('Subscription', 'Typed in by hand. Dates accept 2026-03-01 or 01.03.2026.') +
              af('bsh-a-plan', 'Plan', c.plan, 'Whatever was agreed, in your own words') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-from', 'Paid from', c.subscription_from, '2026-03-01') +
                af('bsh-a-until', 'Paid until', c.subscription_until, '2026-09-01') +
              '</div>' +

              group('Manager') +
              af('bsh-a-mgr', 'Manager name', c.manager_name, 'Anna Kovaleva') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-mgrc', 'Contact', c.manager_contact, '@bs_anna · +44 20 7946 0000') +
                af('bsh-a-mgrw', 'WhatsApp', c.manager_whatsapp, '447700900123',
                   'Digits only, with the country code — it becomes a wa.me link.') +
              '</div>' +

              group('Client') +
              af('bsh-a-name', 'Full name', c.full_name, 'Jane Doe') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-company', 'Venue name', c.company, 'Battle Start Camden') +
                af('bsh-a-city', 'City', c.city, 'London') +
              '</div>' +
              af('bsh-a-address', 'Address', c.address, 'Street and building') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-phone', 'Phone', c.phone, '+44 20 0000 0000') +
                af('bsh-a-tg', 'Telegram', c.telegram, '@username') +
              '</div>' +
              '<div class="bsh-profile__row">' +
                af('bsh-a-web', 'Website', c.website, 'https://') +
                af('bsh-a-logo', 'Logo', c.logo_url, 'https://') +
              '</div>' +
              '<div class="bsh-profile__row">' +
                af('bsh-a-fb', 'Facebook', c.social_facebook, 'https://facebook.com/') +
                af('bsh-a-ig', 'Instagram', c.social_instagram, '@arena') +
              '</div>' +
              af('bsh-a-tgch', 'Telegram channel', c.social_telegram, '@arena_channel') +

              group('Journey', 'A date marks the milestone as reached. Clear it to undo.') +
              (S.msTypes || []).map(function (t) {
                var got = msBySlug[t.slug];
                return af('bsh-a-ms-' + t.slug,
                          (t.icon ? t.icon + ' ' : '') + t.title,
                          got ? got.reached_on : '',
                          '2026-03-01');
              }).join('') +

              group('Access') +
              '<div class="bsh-profile__row">' +
                af('bsh-a-role', 'Role', c.role, 'client', 'client, staff or admin') +
                af('bsh-a-status', 'Status', c.status, 'active',
                   'active or suspended — suspending hides the knowledge base') +
              '</div>' +

              '<div class="bsh-profile__actions" style="margin-top:24px">' +
                '<button class="bsh-btn bsh-btn--primary" type="submit" id="bsh-a-save">Save changes</button>' +

      document.getElementById('bsh-adm-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var msg  = document.getElementById('bsh-msg');
        var btn  = document.getElementById('bsh-a-save');
        msg.innerHTML = '';

        var from  = parseDate(v('bsh-a-from'));
        var until = parseDate(v('bsh-a-until'));
        if (from === false || until === false) {
          msg.innerHTML = alertHtml('error', 'A date must look like 2026-03-01 or 01.03.2026');
          return;
        }
        if (from && until && from > until) {
          msg.innerHTML = alertHtml('error', 'The subscription ends before it starts');
          return;
        }

        var badMilestone = null;
        (S.msTypes || []).forEach(function (t) {
          var el = document.getElementById('bsh-a-ms-' + t.slug);
          if (el && parseDate(el.value) === false) badMilestone = t.title;
        });
        if (badMilestone) {
          msg.innerHTML = alertHtml('error',
            'The date for "' + badMilestone + '" must look like 2026-03-01 or 01.03.2026');
          return;
        }

        btn.classList.add('is-busy');
        btn.innerHTML = '<span class="bsh-spinner"></span>Saving…';

        var patch = {
          plan:               v('bsh-a-plan')    || null,
          subscription_from:  from,
          subscription_until: until,
          manager_name:       v('bsh-a-mgr')     || null,
          manager_contact:    v('bsh-a-mgrc')    || null,
          manager_whatsapp:   v('bsh-a-mgrw')    || null,
          full_name:          v('bsh-a-name')    || null,
          company:            v('bsh-a-company') || null,
          city:               v('bsh-a-city')    || null,
          address:            v('bsh-a-address') || null,
          phone:              v('bsh-a-phone')   || null,
          telegram:           v('bsh-a-tg')      || null,
          website:            v('bsh-a-web')     || null,
          logo_url:           v('bsh-a-logo')    || null,
          social_facebook:    v('bsh-a-fb')      || null,
          social_instagram:   v('bsh-a-ig')      || null,
          social_telegram:    v('bsh-a-tgch')    || null,
          role:               v('bsh-a-role')    || 'client',
          status:             v('bsh-a-status')  || 'active'
        };

        sb.from('profiles').update(patch).eq('id', id).select().maybeSingle()
          .then(function (r) {
            if (r.error) throw r.error;
            /* Refresh the admin's own profile too if they edited themselves. */
            if (id === S.session.user.id) S.profile = r.data;
            return saveJourney();
          })
          .then(function () { return loadClients(true); })
          .then(function () {
            screenAdminEdit(id, alertHtml('ok', 'Saved'));
          })
          .catch(function (err) {
            btn.classList.remove('is-busy');
            btn.textContent = 'Save changes';
            msg.innerHTML = alertHtml('error', humanError(err));
          });

        /* A filled date means the milestone is behind them; an empty one
           means it is not, so the row goes away. */
        function saveJourney() {
          var reached = [], cleared = [];
          (S.msTypes || []).forEach(function (t) {
            var el = document.getElementById('bsh-a-ms-' + t.slug);
            if (!el) return;
            var d = parseDate(el.value);
            if (d) reached.push({ profile_id: id, milestone_slug: t.slug, reached_on: d });
            else cleared.push(t.slug);
          });

          var jobs = [];
          if (reached.length) {
            jobs.push(sb.from('client_milestones').upsert(reached).then(check));
          }
          if (cleared.length) {
            jobs.push(sb.from('client_milestones').delete()
              .eq('profile_id', id).in('milestone_slug', cleared).then(check));
          }
          return Promise.all(jobs);

          function check(r) { if (r.error) throw r.error; }
        }

        function v(elId) { return document.getElementById(elId).value.trim(); }
      });
    });
  }

        '<div class="bsh-card" style="max-width:720px">' +
          '<h1 class="bsh-h2"><span class="bsh-accent">New</span> client</h1>' +
          '<p class="bsh-lead bsh-muted" style="font-size:15px;margin-bottom:24px">' +
            'The account is created straight away and confirmed — hand the ' +
            'password over yourself. The client can change it in their profile.</p>' +

          '<div id="bsh-msg"></div>' +

          '<form id="bsh-new-form">' +
            af('bsh-n-email', 'Email', '', 'client@example.com') +
            af('bsh-n-pass', 'Password', '', 'At least 8 characters',
               'Generate something and send it over a channel you trust.') +

            group('Optional now, editable later') +
            af('bsh-n-name', 'Full name', '', 'Jane Doe') +
            '<div class="bsh-profile__row">' +
              af('bsh-n-company', 'Venue name', '', 'Battle Start Camden') +
              af('bsh-n-city', 'City', '', 'London') +
            '</div>' +
            '<div class="bsh-profile__row">' +
              af('bsh-n-plan', 'Plan', '', 'Whatever was agreed') +
              af('bsh-n-until', 'Paid until', '', '2026-09-01') +
            '</div>' +
            af('bsh-n-mgr', 'Manager name', '', 'Anna Kovaleva') +
            '<div class="bsh-profile__row">' +
              af('bsh-n-mgrc', 'Manager contact', '', '@bs_anna') +
              af('bsh-n-mgrw', 'Manager WhatsApp', '', '447700900123') +
            '</div>' +

            '<div class="bsh-profile__actions" style="margin-top:24px">' +
              '<button class="bsh-btn bsh-btn--accent" type="submit" id="bsh-n-save">Create account</button>' +
              '<a class="bsh-btn bsh-btn--ghost" href="#/admin">Cancel</a>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>');

    bindLogout();

    document.getElementById('bsh-new-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('bsh-msg');
      var btn = document.getElementById('bsh-n-save');
      msg.innerHTML = '';

      var email = v('bsh-n-email').toLowerCase();
      var pass  = v('bsh-n-pass');
      var until = parseDate(v('bsh-n-until'));

      if (email.indexOf('@') === -1) { msg.innerHTML = alertHtml('error', 'Enter a valid email'); return; }
      if (pass.length < 8)           { msg.innerHTML = alertHtml('error', 'The password must be at least 8 characters'); return; }
      if (until === false)           { msg.innerHTML = alertHtml('error', 'A date must look like 2026-03-01 or 01.03.2026'); return; }

      btn.classList.add('is-busy');
      btn.innerHTML = '<span class="bsh-spinner"></span>Creating…';

      /* Account creation needs the service role key, which must never be
         in a page. The Edge Function holds it and checks the caller. */
      sb.functions.invoke('admin-create-client', {
        body: {
          email: email, password: pass,
          full_name:        v('bsh-n-name')    || null,
          company:          v('bsh-n-company') || null,
          city:             v('bsh-n-city')    || null,
          plan:             v('bsh-n-plan')    || null,
          subscription_until: until,
          manager_name:     v('bsh-n-mgr')     || null,
          manager_contact:  v('bsh-n-mgrc')    || null,
          manager_whatsapp: v('bsh-n-mgrw')    || null
        }
      }).then(function (r) {
        btn.classList.remove('is-busy');
        btn.textContent = 'Create account';

        if (r.error) {
          msg.innerHTML = alertHtml('error', functionError(r));
          return;
        }
        if (r.data && r.data.warning) {
          msg.innerHTML = alertHtml('info', r.data.warning);
        }
        S.clients = null;
        loadClients().then(function () { go('#/admin'); });
      });

      function v(elId) { return document.getElementById(elId).value.trim(); }
    });
  }

  /* The function returns a readable reason in its body; surface that
     rather than the generic "Edge Function returned a non-2xx status". */
  function functionError(r) {
    var ctx = r.error && r.error.context;
    if (ctx && ctx.status === 404) {
      return 'The admin-create-client function is not deployed yet. ' +
             'Until it is, create the account in the Supabase Dashboard ' +
             '(Authentication → Users → Add user).';
    }
    if (r.data && r.data.error) return r.data.error;
    if (r.error && r.error.message) return r.error.message;
    return 'Could not create the account';
  }

  /* Experience for any profile, not just the signed-in one. */
  function expOf(p) { return (p && p.exp) || 0; }
  function levelOf(p) {
    var exp = expOf(p), lvl = 1;
    (S.levels || []).forEach(function (l) { if (exp >= l.min_exp && l.level > lvl) lvl = l.level; });
    return lvl;
  }

  /* ===================================================================
     ROUTING
     Every screen lives at a hash on this one page, so signing in and
     moving around never reloads and never leaves the block.
     =================================================================== */
  function pageUrl() {
    return window.location.origin + window.location.pathname;
  }

  function go(hash) {
    if (window.location.hash === hash) route();
    else window.location.hash = hash;
  }

  function route() {
    var h = (window.location.hash || '').replace(/^#/, '');

    /* A hash left over from the recovery email is not a route */
    if (h.indexOf('access_token') !== -1 || h.indexOf('error_description') !== -1) h = '';

    if (!h || h === '/') h = S.session ? '/hub' : '/login';

    if (h === '/login')  { if (S.session) return go('#/hub'); return screenLogin(); }
    if (h === '/reset')  { return screenReset(); }

    /* everything below is private */
    if (!S.session) return go('#/login');

    if (!S.loaded) {
      booting();
      return ensureData().then(route).catch(function (e) { fatal(humanError(e)); });
    }

    if (h === '/hub')     return screenHome();
    if (h === '/profile') return screenProfile();

    if (h === '/admin')     return screenAdminList();
    if (h === '/admin/new') return screenAdminNew();
    var mCli = /^\/admin\/c\/(.+)$/.exec(h);
    if (mCli) return screenAdminEdit(decodeURIComponent(mCli[1]));

    var mArt = /^\/kb\/a\/(.+)$/.exec(h);
    if (mArt) return screenArticle(decodeURIComponent(mArt[1]));

    var mCat = /^\/kb\/c\/(.+)$/.exec(h);
    if (mCat) return screenKb(decodeURIComponent(mCat[1]));

    if (h === '/kb') return screenKb(null);

    return go('#/hub');
  }

  /* ===================================================================
     START-UP
     =================================================================== */
  function loadLib(done) {
    if (window.supabase && window.supabase.createClient) return done();
    var tag = document.createElement('script');
    tag.src = LIB_URL;
    tag.onload = done;
    tag.onerror = function () { fatal('The supabase-js library failed to load. Check the connection and any ad blockers.'); };
    document.head.appendChild(tag);
  }

  function boot() {
    if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CONFIG.url) || !CONFIG.anonKey ||
        CONFIG.anonKey.indexOf('YOUR-ANON-KEY') !== -1) {
      fatal('The hub is not configured yet: fill in url and anonKey in CONFIG at the top of the block.');
      return;
    }

    /* A secret key in page source would hand every visitor full read and
       write access to the database, RLS included. Refuse to start. */
    if (/^sb_secret_/.test(CONFIG.anonKey) || /service_role/.test(CONFIG.anonKey)) {
      fatal('That is a SECRET key. Put the publishable (anon) key here instead — a secret key bypasses row level security and must never appear in page source. Rotate this key in Project Settings -> API.');
      return;
    }

    /* Note it before creating the client — supabase-js clears the hash */
    S.recovery = (window.location.hash || '').indexOf('type=recovery') !== -1;

    booting();

    loadLib(function () {
      sb = window.supabase.createClient(CONFIG.url, CONFIG.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });

      sb.auth.getSession().then(function (r) {
        S.session = r.data.session;
        window.addEventListener('hashchange', route);
        if (S.session && S.recovery) return go('#/reset');
        route();
      }).catch(function (err) {
        fatal(humanError(err));
      });
    });
  }

  boot();
})();
</script>
