<!-- =====================================================================
     BATTLE START — CLIENT HUB
     The whole hub in one file: styles, Supabase auth, router and every
     screen (sign in, password reset, home, knowledge base, article,
     profile).

     HOW TO INSTALL
       1. Tilda -> create one page, e.g. /hub
       2. Add a Zero Block -> "HTML" element (a T123 block works too)
       3. Paste this entire file
       4. Fill in CONFIG at the top of the <script> below
     Nothing goes into the site HEAD. This is the only block you need.
     ===================================================================== -->

<style>

.bsh-logo {
  display: block;
  background-color: currentColor;
  -webkit-mask: var(--bsh-logo) no-repeat center / contain;
          mask: var(--bsh-logo) no-repeat center / contain;
}

/* ---------------------------------------------------------------------
   BASE. Everything is scoped to .bsh so it never clashes with Tilda.
   --------------------------------------------------------------------- */
.bsh, .bsh * { box-sizing: border-box; }
.bsh {
  font-family: var(--bsh-font);
  color: var(--bsh-navy);
  font-size: 16px;
  line-height: 1.55;
  background: var(--bsh-bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.bsh img { max-width: 100%; display: block; }

/* Links inherit colour by default: otherwise blue overrides card
   headings, the logo and the nav items. Blue is applied deliberately. */
.bsh a { color: inherit; text-decoration: none; cursor: pointer; }
.bsh-link, .bsh-prose a { color: var(--bsh-blue); }
.bsh-link:hover, .bsh-prose a:hover { color: var(--bsh-blue-dark); }

.bsh-wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 20px; }

/* ---------------------------------------------------------------------
   TYPOGRAPHY. The reference's signature move is the two-tone heading:
   <h2 class="bsh-h2"><span class="bsh-accent">Knowledge</span> base</h2>
   --------------------------------------------------------------------- */
.bsh-h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 0 0 14px; }
.bsh-h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.16; margin: 0 0 12px; }
.bsh-h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 8px; }
.bsh-accent { color: var(--bsh-pink); }
.bsh-lead   { font-size: 17px; color: var(--bsh-navy-2); margin: 0 0 8px; }
.bsh-muted  { color: var(--bsh-muted); }
.bsh-label  { font-size: 13px; font-weight: 500; color: var(--bsh-muted); }
.bsh-center { text-align: center; }

.bsh-section { padding: 32px 0; }

/* ---------------------------------------------------------------------
   PILLS AND BADGES
   --------------------------------------------------------------------- */
.bsh-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: var(--bsh-pill);
  background: var(--bsh-soft); color: var(--bsh-navy-2);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.bsh-badge--pink { background: var(--bsh-pink); color: #fff; }
.bsh-badge--blue { background: var(--bsh-blue-soft); color: var(--bsh-blue-dark); }

/* ---------------------------------------------------------------------
   BUTTONS
   --------------------------------------------------------------------- */
.bsh-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 26px; border-radius: var(--bsh-pill);
  border: 1px solid transparent; cursor: pointer;
  font-family: var(--bsh-font); font-size: 15px; font-weight: 700;
  line-height: 1; white-space: nowrap;
  transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
}
.bsh-btn:active { transform: translateY(1px); }
.bsh-btn[disabled], .bsh-btn.is-busy { opacity: .6; pointer-events: none; }
.bsh-btn--primary { background: var(--bsh-blue); color: #fff; box-shadow: 0 6px 18px rgba(47, 107, 255, .28); }
.bsh-btn--primary:hover { background: var(--bsh-blue-dark); color: #fff; }
.bsh-btn--accent { background: var(--bsh-pink); color: #fff; box-shadow: 0 6px 18px rgba(236, 30, 94, .26); }
.bsh-btn--accent:hover { background: var(--bsh-pink-dark); color: #fff; }
.bsh-btn--ghost { background: #fff; color: var(--bsh-navy); border-color: var(--bsh-line); }
.bsh-btn--ghost:hover { border-color: #C9D0E4; color: var(--bsh-navy); }
.bsh-btn--wide { width: 100%; }
.bsh-btn--sm   { padding: 10px 18px; font-size: 14px; }

/* ---------------------------------------------------------------------
   CARDS AND TILES
   --------------------------------------------------------------------- */
.bsh-card {
  background: var(--bsh-surface);
  border-radius: var(--bsh-radius-lg);
  box-shadow: var(--bsh-shadow);
  padding: 32px;
}
.bsh-card--flat { box-shadow: var(--bsh-shadow-soft); }
.bsh-card--pad-sm { padding: 22px; }

.bsh-tile { background: var(--bsh-soft); border-radius: var(--bsh-radius-sm); padding: 16px 18px; }
.bsh-tile__label { font-size: 13px; color: var(--bsh-muted); margin-bottom: 6px; }
.bsh-tile__value { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.bsh-tile__value--pink { color: var(--bsh-pink); }

/* ---------------------------------------------------------------------
   PILL HEADER (as on the reference: a white capsule over the content)
   --------------------------------------------------------------------- */
.bsh-nav {
  position: sticky; top: 14px; z-index: 900;
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: var(--bsh-pill);
  box-shadow: var(--bsh-shadow-nav);
  padding: 10px 12px 10px 22px;
  margin: 14px auto 0;
}
.bsh-nav__logo {
  flex: none; margin-right: 10px;
  width: 112px; height: 23px;
  color: var(--bsh-navy);          /* same colour as the body text */
}
.bsh-nav__links { display: flex; align-items: center; gap: 4px; }
.bsh-nav__link {
  padding: 9px 14px; border-radius: var(--bsh-pill);
  font-size: 15px; font-weight: 600; white-space: nowrap;
}
.bsh-nav__link:hover { background: var(--bsh-soft); }
.bsh-nav__link.is-active { background: var(--bsh-soft); color: var(--bsh-pink); }
.bsh-nav__side { display: flex; align-items: center; gap: 10px; margin-left: auto; }

/* ---------------------------------------------------------------------
   TABS (category switcher, like the reference's 10 m2 / 400 m2 row)
   --------------------------------------------------------------------- */
.bsh-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
.bsh-tab {
  padding: 11px 20px; border-radius: var(--bsh-radius-sm);
  background: #fff; border: 1px solid var(--bsh-line);
  color: var(--bsh-navy); font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: var(--bsh-font); transition: all .18s ease;
}
.bsh-tab:hover { border-color: #C9D0E4; }
.bsh-tab.is-active { background: var(--bsh-pink); border-color: var(--bsh-pink); color: #fff; }

/* A category kept behind the paywall: still listed, visibly closed. */
.bsh-tab--locked { background: #F4F6FB; color: var(--bsh-muted); border-style: dashed; }
.bsh-tab--locked:hover { border-color: var(--bsh-pink); }
.bsh-tab--locked.is-active { background: var(--bsh-navy); border-color: var(--bsh-navy); color: #fff; }

/* Said in plain sight, for the readers who cannot hover over the chip. */
.bsh-kb__note { margin: -8px 0 22px; font-size: 14px; line-height: 1.5; }
.bsh-kb__note .bsh-link { color: inherit; text-decoration: underline; }

/* ---------------------------------------------------------------------
   TOOLTIP
   A hover note that explains why something is closed. Pure CSS, because
   the block has to survive inside a page builder that reorders scripts.
   --------------------------------------------------------------------- */
.bsh-tip { position: relative; }
.bsh-tip::after {
  content: attr(data-tip);
  position: absolute; left: 50%; bottom: calc(100% + 11px);
  transform: translateX(-50%) translateY(5px);
  width: max-content; max-width: 240px;
  padding: 9px 13px; border-radius: 10px;
  background: var(--bsh-navy); color: #fff;
  font-size: 12.5px; font-weight: 600; line-height: 1.35;
  text-align: center; white-space: normal;
  box-shadow: 0 8px 22px rgba(31, 42, 90, .22);
  opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 40;
}
.bsh-tip::before {
  content: ''; position: absolute; left: 50%; bottom: calc(100% + 5px);
  transform: translateX(-50%) translateY(5px);
  border: 6px solid transparent; border-top-color: var(--bsh-navy);
  opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 40;
}
.bsh-tip:hover::after, .bsh-tip:focus-visible::after,
.bsh-tip:hover::before, .bsh-tip:focus-visible::before {
  opacity: 1; transform: translateX(-50%) translateY(0);
}

/* ---------------------------------------------------------------------
   FORMS
   --------------------------------------------------------------------- */
.bsh-field { margin-bottom: 16px; }
.bsh-field__label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--bsh-muted); margin-bottom: 7px;
}
textarea.bsh-input { min-height: 104px; resize: vertical; font-family: var(--bsh-font); }
.bsh-input {
  width: 100%; padding: 14px 16px;
  border: 1px solid var(--bsh-line); border-radius: var(--bsh-radius-sm);
  background: #fff; color: var(--bsh-navy);
  font-family: var(--bsh-font); font-size: 15px; line-height: 1.4;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.bsh-input::placeholder { color: #AEB6C7; }
.bsh-input:focus { outline: none; border-color: var(--bsh-blue); box-shadow: 0 0 0 4px rgba(47, 107, 255, .12); }
.bsh-input[readonly] { background: var(--bsh-soft); color: var(--bsh-muted); }

.bsh-alert { border-radius: var(--bsh-radius-sm); padding: 13px 16px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.bsh-alert--error { background: var(--bsh-pink-soft); color: var(--bsh-pink-dark); }
.bsh-alert--ok    { background: #E6F7EE; color: #12784A; }
.bsh-alert--info  { background: var(--bsh-blue-soft); color: var(--bsh-blue-dark); }

/* ---------------------------------------------------------------------
   LOADING AND EMPTY STATES
   --------------------------------------------------------------------- */
.bsh-skel {
  background: linear-gradient(90deg, #EEF1F8 25%, #F7F9FD 37%, #EEF1F8 63%);
  background-size: 400% 100%; animation: bsh-shimmer 1.3s ease infinite;
  border-radius: var(--bsh-radius-sm);
}
@keyframes bsh-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

.bsh-spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff;
  animation: bsh-spin .7s linear infinite;
}
@keyframes bsh-spin { to { transform: rotate(360deg); } }

.bsh-boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.bsh-boot__dot {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--bsh-line); border-top-color: var(--bsh-pink);
  animation: bsh-spin .7s linear infinite;
}
.bsh-empty { text-align: center; padding: 48px 20px; color: var(--bsh-muted); }
.bsh-empty__icon { font-size: 40px; margin-bottom: 12px; }

/* ---------------------------------------------------------------------
   SIGN IN / PASSWORD RESET
   --------------------------------------------------------------------- */
.bsh-auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.bsh-auth__box { width: 100%; max-width: 440px; }
.bsh-auth__logo { text-align: center; margin-bottom: 26px; }
.bsh-auth__logo .bsh-logo {
  width: 176px; height: 36px; margin: 0 auto 10px;
  color: var(--bsh-navy);
}
.bsh-auth__logo span { font-size: 13px; color: var(--bsh-muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.bsh-auth__foot { text-align: center; margin-top: 22px; font-size: 13px; color: var(--bsh-muted); line-height: 1.6; }
.bsh-auth__forgot { color: var(--bsh-blue); display: block; text-align: right; font-size: 13px; font-weight: 600; margin: -6px 0 20px; }

/* ---------------------------------------------------------------------
   HOME
   --------------------------------------------------------------------- */
.bsh-hero { padding: 44px 0 8px; }

.bsh-recent { margin-top: 34px; }
.bsh-recent__row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--bsh-line); }
.bsh-recent__row:first-of-type { border-top: none; }
.bsh-recent__row:hover { color: var(--bsh-pink); }
.bsh-recent__title { font-weight: 700; font-size: 16px; }
.bsh-recent__sum { font-size: 14px; color: var(--bsh-muted); margin-top: 2px; display: block; }
.bsh-recent__body { flex: 1; min-width: 0; }
.bsh-recent__arrow { color: var(--bsh-muted); font-size: 20px; flex: none; }

/* ---------------------------------------------------------------------
   EXPERIENCE. The client earns it by describing their arena; the bar and
   the task list exist to make the next step obvious and small.
   --------------------------------------------------------------------- */
.bsh-lvl {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: var(--bsh-pill);
  background: var(--bsh-pink-soft); color: var(--bsh-pink);
  font-size: 12px; font-weight: 800; letter-spacing: .02em; white-space: nowrap;
}
.bsh-xp__bar { height: 12px; border-radius: 999px; background: var(--bsh-soft); overflow: hidden; margin: 14px 0 10px; }
.bsh-xp__fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--bsh-pink), #FF6E9E);
  transition: width .7s cubic-bezier(.2, .7, .3, 1);
}
.bsh-xp__hint { font-size: 14px; color: var(--bsh-muted); }
.bsh-xp__perk { margin-top: auto; padding: 16px 18px; border-radius: var(--bsh-radius-sm); background: var(--bsh-pink-soft); }
.bsh-xp__perk b {
  display: block; font-size: 11px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--bsh-pink); margin-bottom: 6px;
}
.bsh-xp__perk span { font-size: 15px; font-weight: 700; color: var(--bsh-navy); line-height: 1.45; }

.bsh-tasks__title {
  font-size: 12px; font-weight: 800; color: var(--bsh-muted);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 14px;
}
.bsh-task {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--bsh-radius-sm);
  background: var(--bsh-soft); margin-bottom: 8px;
}
.bsh-task:hover { background: #E9EDF8; }
.bsh-task__label { font-size: 14px; font-weight: 700; }
.bsh-task__hint { font-size: 12px; color: var(--bsh-muted); display: block; margin-top: 1px; }
.bsh-task__pts { margin-left: auto; flex: none; font-size: 13px; font-weight: 800; color: var(--bsh-pink); }
.bsh-tasks__done { padding: 26px 18px; text-align: center; color: var(--bsh-muted); font-size: 14px; }

.bsh-pts {
  font-size: 11px; font-weight: 800; color: var(--bsh-pink);
  background: var(--bsh-pink-soft); padding: 2px 7px; border-radius: var(--bsh-pill);
}

/* locked article card: advertised, not readable */
.bsh-art--locked { background: #fff; border: 1px dashed #D6DCEC; }
.bsh-art--locked:hover { background: #fff; border-color: var(--bsh-pink); transform: none; }
.bsh-art--locked .bsh-art__title { opacity: .6; }
.bsh-art--locked .bsh-art__sum { opacity: .6; }
.bsh-art__lock { margin-top: auto; font-size: 14px; font-weight: 800; color: var(--bsh-pink); }

.bsh-locked { text-align: center; padding: 54px 26px; }
.bsh-locked__icon { font-size: 44px; margin-bottom: 14px; }
.bsh-locked__bar { max-width: 420px; margin: 24px auto 0; }

@media (max-width: 960px) { .bsh-xp { grid-template-columns: minmax(0, 1fr); gap: 24px; } }

/* ---------------------------------------------------------------------
   SECTION RAIL. Collapsed it is a column of dots at the edge of the
   viewport; hovering opens the labels over a white panel, so the reader
   sees what is further down without scrolling to find out. Hidden on
   narrow screens, where it would sit on top of the content.
   --------------------------------------------------------------------- */
.bsh-rail {
  position: fixed; left: 18px; top: 50%; transform: translateY(-50%);
  z-index: 800; display: none; flex-direction: column; gap: 2px;
  padding: 10px 8px; border-radius: 20px;
  transition: background .2s ease, box-shadow .2s ease, padding .2s ease;
}
@media (min-width: 1180px) { .bsh-rail { display: flex; } }
.bsh-rail:hover { background: #fff; box-shadow: var(--bsh-shadow); padding-right: 18px; }

.bsh-rail__item {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 6px; border: 0; background: none; cursor: pointer;
  font-family: var(--bsh-font); font-size: 13px; font-weight: 700;
  color: var(--bsh-muted); text-align: left; border-radius: var(--bsh-pill);
  transition: color .18s ease;
}
.bsh-rail__item:hover { color: var(--bsh-navy); }
.bsh-rail__item.is-active { color: var(--bsh-pink); }

.bsh-rail__dot {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: var(--bsh-line); transition: background .18s ease, transform .18s ease;
}
.bsh-rail__item:hover .bsh-rail__dot { background: #C9D0E4; }
.bsh-rail__item.is-active .bsh-rail__dot { background: var(--bsh-pink); transform: scale(1.45); }

.bsh-rail__label {
  /* min-width:auto on a flex item would beat max-width and keep the
     label at full width, so the rail never collapsed. */
  min-width: 0;
  max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0;
  transition: max-width .22s ease, opacity .18s ease;
}
.bsh-rail:hover .bsh-rail__label { max-width: 200px; opacity: 1; }

/* ---------------------------------------------------------------------
   ADMINISTRATION. Every value here is typed in by hand — the plan is
   whatever was actually agreed, not an entry from a list.
   --------------------------------------------------------------------- */
/* Set only the vertical padding: these classes are put on .bsh-wrap
   itself, and a shorthand here would drop the side padding that keeps
   the page in line with the header. */
.bsh-adm { padding-top: 44px; padding-bottom: 72px; }
.bsh-adm__bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.bsh-adm__search { flex: 1; min-width: 220px; max-width: 360px; }
.bsh-adm__row {
  display: flex; align-items: center; gap: 18px;
  padding: 15px 0; border-top: 1px solid var(--bsh-line);
}
.bsh-adm__row:first-of-type { border-top: none; }
.bsh-adm__row:hover { color: var(--bsh-pink); }
.bsh-adm__who { flex: 1; min-width: 0; }
.bsh-adm__name { font-weight: 700; font-size: 15px; }
.bsh-adm__mail { font-size: 13px; color: var(--bsh-muted); display: block; margin-top: 1px; }
.bsh-adm__cell { flex: none; width: 150px; font-size: 13px; color: var(--bsh-navy-2); }
.bsh-adm__cell b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--bsh-muted); margin-bottom: 3px; font-weight: 700; }
.bsh-adm__arrow { flex: none; color: var(--bsh-muted); font-size: 20px; }
.bsh-adm__group { margin: 30px 0 18px; }
.bsh-adm__group h3 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
.bsh-adm__group p { font-size: 13px; color: var(--bsh-muted); margin: 0; }

.bsh-badge--ok   { background: #E6F7EE; color: #12784A; }
.bsh-badge--warn { background: #FFF1E0; color: #A15600; }
.bsh-badge--off  { background: var(--bsh-soft); color: var(--bsh-muted); }

.bsh-sub { display: grid; gap: 4px; }
.bsh-sub__plan { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.bsh-sub__dates { font-size: 13px; color: var(--bsh-muted); }

@media (max-width: 860px) {
  .bsh-adm__row { flex-wrap: wrap; gap: 10px 18px; }
  .bsh-adm__who { flex-basis: 100%; }
  .bsh-adm__cell { width: auto; min-width: 110px; }
}

/* ---------------------------------------------------------------------
   KNOWLEDGE BASE
   --------------------------------------------------------------------- */
.bsh-kb { padding-top: 44px; padding-bottom: 72px; }
.bsh-kb__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.bsh-art {
  display: flex; flex-direction: column; gap: 10px;
  background: var(--bsh-soft); border-radius: var(--bsh-radius-md); padding: 22px;
  transition: background .18s ease, transform .18s ease;
}
.bsh-art:hover { background: #E9EDF8; transform: translateY(-2px); }
.bsh-art__top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bsh-art__title { font-size: 18px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
.bsh-art__sum { font-size: 14px; color: var(--bsh-muted); line-height: 1.55; }
.bsh-art__more { margin-top: auto; font-size: 14px; font-weight: 700; color: var(--bsh-pink); }

.bsh-kb__search { position: relative; margin-bottom: 22px; max-width: 460px; }
.bsh-kb__search .bsh-input { padding-left: 44px; }
.bsh-kb__search::before { content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .5; }

.bsh-back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--bsh-muted); margin-bottom: 20px; }
.bsh-back:hover { color: var(--bsh-pink); }
.bsh-art__meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 26px; }
.bsh-art__cover { border-radius: var(--bsh-radius-md); margin-bottom: 26px; }

/* article typography */
.bsh-prose { font-size: 16px; line-height: 1.7; color: var(--bsh-navy-2); }
.bsh-prose h2 { font-size: 24px; font-weight: 800; color: var(--bsh-navy); margin: 32px 0 12px; letter-spacing: -.01em; }
.bsh-prose h3 { font-size: 19px; font-weight: 800; color: var(--bsh-navy); margin: 26px 0 10px; }
.bsh-prose h4 { font-size: 17px; font-weight: 700; color: var(--bsh-navy); margin: 22px 0 8px; }
.bsh-prose > *:first-child { margin-top: 0; }
.bsh-prose p { margin: 0 0 16px; }
.bsh-prose ul, .bsh-prose ol { margin: 0 0 18px; padding-left: 22px; }
.bsh-prose li { margin-bottom: 8px; }
.bsh-prose li::marker { color: var(--bsh-pink); font-weight: 700; }
.bsh-prose strong { color: var(--bsh-navy); font-weight: 800; }
.bsh-prose hr { border: none; border-top: 1px solid var(--bsh-line); margin: 28px 0; }
.bsh-prose img { border-radius: var(--bsh-radius-md); margin: 18px 0; }
.bsh-prose code { background: var(--bsh-soft); border-radius: 6px; padding: 2px 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }
.bsh-prose blockquote { margin: 22px 0; padding: 16px 20px; background: var(--bsh-pink-soft); border-radius: var(--bsh-radius-sm); color: var(--bsh-navy); font-weight: 600; }
.bsh-prose table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 15px; }
.bsh-prose th, .bsh-prose td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--bsh-line); }
.bsh-prose th { color: var(--bsh-muted); font-size: 13px; font-weight: 600; }
.bsh-prose__scroll { overflow-x: auto; }

/* attachments */
.bsh-files { margin-top: 34px; }
.bsh-file { display: flex; align-items: center; gap: 14px; background: var(--bsh-soft); border-radius: var(--bsh-radius-sm); padding: 14px 18px; margin-bottom: 10px; }
.bsh-file:hover { background: #E9EDF8; }
.bsh-file__icon { font-size: 20px; flex: none; }
.bsh-file__title { font-weight: 700; font-size: 15px; display: block; }
.bsh-file__size { font-size: 13px; color: var(--bsh-muted); }
.bsh-file__dl { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--bsh-blue); flex: none; }

/* ---------------------------------------------------------------------
   PROFILE
   --------------------------------------------------------------------- */
.bsh-profile { padding-top: 44px; padding-bottom: 72px; }
.bsh-profile__cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.bsh-profile__row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bsh-profile__head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.bsh-profile__ava {
  width: 62px; height: 62px; border-radius: 50%; flex: none;
  background: var(--bsh-pink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800;
}
.bsh-profile__name { font-size: 21px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.bsh-profile__mail { font-size: 14px; color: var(--bsh-muted); }
.bsh-profile__actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.bsh-tiles { display: grid; gap: 12px; margin-bottom: 20px; }
.bsh-divider { border: none; border-top: 1px solid var(--bsh-line); margin: 30px 0; }

/* ---------------------------------------------------------------------
   RESPONSIVE
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   THE IDENTITY PILL in the header: rank emblem, name, experience.
   --------------------------------------------------------------------- */
.bsh-me {
  display: flex; align-items: center; gap: 11px;
  background: var(--bsh-soft); border-radius: var(--bsh-pill);
  padding: 5px 8px 5px 6px; color: inherit;
}
.bsh-me:hover { background: #E9EDF8; color: inherit; }
.bsh-me__badge { position: relative; flex: none; width: 54px; height: 56px; }
.bsh-me__wreath {
  position: absolute; inset: 0; width: 100%; height: 100%;
  color: #A9B2C6; pointer-events: none;
}
.bsh-me__avatar {
  position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bsh-pink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; letter-spacing: -.01em;
}
.bsh-me__lvl {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  padding: 1px 6px; border-radius: var(--bsh-pill);
  background: var(--bsh-navy); color: #fff;
  font-size: 8.5px; font-weight: 800; letter-spacing: .04em; white-space: nowrap;
}
.bsh-me__who { display: grid; min-width: 0; }
.bsh-me__name { font-size: 14px; font-weight: 800; line-height: 1.2; }
.bsh-me__company { font-size: 12px; color: var(--bsh-muted); line-height: 1.2; }
.bsh-me__exp {
  flex: none; padding: 6px 11px; border-radius: var(--bsh-pill);
  background: var(--bsh-pink-soft); color: var(--bsh-pink);
  font-size: 12px; font-weight: 800; white-space: nowrap;
}


/* ---------------------------------------------------------------------
   HOME: a dashboard rather than a stack. The two things a client acts
   on — where they stand and what is next — sit side by side, with the
   journey beside them as the longer story.
   --------------------------------------------------------------------- */
/* Headings on one row, cards on the next: laid out as a grid rather than
   as two independent columns, so a two-line heading on one side cannot
   push its cards below the other side's, and every card in the row ends
   on the same line. */
.bsh-home {
  display: grid;
  grid-template-columns: minmax(0, 1.92fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "headmain headaside" "duo aside";
  column-gap: 26px; row-gap: 0;
  padding: 8px 0 14px;
}
.bsh-home + .bsh-recent, .bsh-home + .bsh-section { padding-top: 14px; margin-top: 0; }
.bsh-home__head { grid-area: headmain; margin-bottom: 22px; }
.bsh-home__head--aside { grid-area: headaside; }
.bsh-duo {
  grid-area: duo;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.06fr); gap: 22px;
}
.bsh-duo > * { min-width: 0; }
.bsh-home__aside { grid-area: aside; display: flex; }
.bsh-home__aside > .bsh-card { flex: 1; }

/* --- the rank card, built around a ring --- */
.bsh-rank { display: flex; flex-direction: column; }
.bsh-rank__head { display: flex; align-items: center; gap: 12px; }
/* The tasks beside it decide the height, so the ring centres in whatever
   room is left rather than leaving a pool of white below itself. */
.bsh-rank__mid { margin: auto 0; padding: 18px 0; }
.bsh-rank__title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.bsh-ring { position: relative; width: 200px; max-width: 100%; margin: 0 auto 8px; }
.bsh-ring svg { display: block; width: 100%; height: auto; transform: rotate(-90deg); }
.bsh-ring__rail { fill: none; stroke: var(--bsh-soft); }
.bsh-ring__fill {
  fill: none; stroke: var(--bsh-pink); stroke-linecap: round;
  transition: stroke-dashoffset .7s cubic-bezier(.4, 0, .2, 1);
}
/* A soft halo, so the ring reads as an award rather than a progress bar. */
.bsh-ring__glow {
  position: absolute; inset: 12%; border-radius: 50%;
  background: radial-gradient(circle, rgba(236,30,94,.16) 0%, rgba(236,30,94,0) 68%);
  pointer-events: none;
}
.bsh-ring__mid {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 0 18px;
}
.bsh-ring__icon { font-size: 30px; line-height: 1; margin-bottom: 4px; filter: grayscale(.85) opacity(.75); }
.bsh-ring__cap { font-size: 12.5px; font-weight: 700; color: var(--bsh-muted); }
.bsh-ring__pct { font-size: 40px; font-weight: 800; letter-spacing: -.03em; color: var(--bsh-pink); line-height: 1.1; }
.bsh-rank__foot { font-size: 13.5px; color: var(--bsh-muted); text-align: center; margin-top: 2px; }

/* --- the journey, read top to bottom --- */
.bsh-road { display: grid; gap: 0; }
.bsh-road__step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; position: relative; }
.bsh-road__step + .bsh-road__step { margin-top: 4px; }
/* the line that joins one milestone to the next */
.bsh-road__step::before {
  content: ''; position: absolute; left: 21px; top: 40px; bottom: -4px;
  width: 2px; background: var(--bsh-line);
}
.bsh-road__step:last-child::before { display: none; }
.bsh-road__step.is-done::before { background: var(--bsh-green); }
.bsh-road__dot {
  width: 44px; height: 44px; border-radius: 50%; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; background: var(--bsh-soft); color: var(--bsh-navy);
}
.bsh-road__step.is-done .bsh-road__dot { background: var(--bsh-green); color: #fff; font-size: 19px; font-weight: 800; }
.bsh-road__step.is-next .bsh-road__dot {
  background: var(--bsh-pink); color: #fff;
  box-shadow: 0 0 0 7px var(--bsh-pink-soft), 0 8px 20px rgba(236, 30, 94, .3);
}
.bsh-road__step.is-future { opacity: .55; }
.bsh-road__body { padding: 3px 0 14px; min-width: 0; }
.bsh-road__title { font-size: 15px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
.bsh-road__sub { font-size: 13px; color: var(--bsh-muted); line-height: 1.4; margin-top: 2px; }
.bsh-road__step.is-next .bsh-road__title { color: var(--bsh-pink); }


/* Hover belongs to a mouse. On a touch screen the state sticks after a
   tap, so a card stays lifted and a row stays pink until something else
   is touched. These effects are decoration, so they are simply not
   offered to devices that cannot really hover. */
@media (hover: none) {
  .bsh-art:hover      { background: var(--bsh-soft); transform: none; }
  .bsh-art--locked:hover { border-color: #D6DCEC; }
  .bsh-recent__row:hover { color: inherit; }
  .bsh-task:hover     { background: var(--bsh-soft); }
  .bsh-tab:hover      { border-color: var(--bsh-line); }
  .bsh-tab--locked:hover { border-color: var(--bsh-line); }
  .bsh-nav__link:hover { background: none; }
  .bsh-nav__link.is-active:hover { background: var(--bsh-soft); }
}

/* The header runs out of room for one row long before a phone does: four
   sections, an identity pill and two buttons. Give the sections a row of
   their own as soon as they stop fitting, or the pill is squeezed until
   its own contents stack. */
@media (max-width: 900px) {
  .bsh-nav {
    border-radius: var(--bsh-radius-lg);
    padding: 10px 12px; gap: 8px; flex-wrap: wrap;
  }
  .bsh-nav__links {
    order: 3; width: 100%; gap: 2px;
    overflow-x: auto; scrollbar-width: none;
    padding-top: 6px; scroll-padding-inline: 16px;
  }
  .bsh-nav__links::-webkit-scrollbar { display: none; }
  .bsh-nav__side { margin-left: auto; }
}

/* The dashboard needs real width for three cards abreast. Below that the
   journey drops under the pair, and below that again the pair unstacks. */
@media (max-width: 1120px) {
  .bsh-home {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    grid-template-areas: "headmain" "duo" "headaside" "aside";
  }
  .bsh-home__head--aside { margin-top: 30px; }
}
@media (max-width: 960px) {
  .bsh-profile__cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .bsh-duo { grid-template-columns: minmax(0, 1fr); }
  .bsh-rank__mid { padding: 6px 0 0; }
}

/* ---------------------------------------------------------------------
   PHONE
   One column, one thumb. Three rules drive everything below:
   every control is at least 44px tall, every input is at least 16px so
   iOS does not zoom the page on focus, and anything that cannot fit
   scrolls sideways inside its own frame rather than widening the page.
   --------------------------------------------------------------------- */
@media (max-width: 720px) {
  .bsh-wrap { padding: 0 16px; }
  .bsh-card { padding: 20px 18px; border-radius: var(--bsh-radius-md); }
  .bsh-kb__grid, .bsh-profile__row { grid-template-columns: minmax(0, 1fr); }
  .bsh-hero { padding-top: 22px; }
  .bsh-kb, .bsh-profile, .bsh-adm { padding-top: 24px; padding-bottom: 44px; }
  .bsh-lead { font-size: 16px; }

  .bsh-nav__logo { width: 96px; height: 20px; margin-right: 0; }
  /* The emblem carries the identity here; the name is on the profile
     screen, and spelling it out costs the row more than it is worth. */
  .bsh-me__who { display: none; }
  .bsh-me { gap: 8px; padding: 3px 6px 3px 4px; }
  .bsh-me__badge { width: 42px; height: 44px; }
  .bsh-me__avatar { width: 24px; height: 24px; font-size: 10.5px; top: 4px; }
  .bsh-me__lvl { font-size: 7.5px; padding: 1px 5px; }
  .bsh-me__exp { padding: 5px 9px; font-size: 11.5px; }
  .bsh-nav__side { gap: 6px; }

  /* the dashboard, one card at a time */
  .bsh-duo { gap: 16px; }
  .bsh-ring { width: 168px; }
  .bsh-ring__pct { font-size: 34px; }
  .bsh-ring__icon { font-size: 26px; }
  .bsh-rank__title { font-size: 21px; }
  .bsh-road__step { grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
  .bsh-road__dot { width: 40px; height: 40px; }
  .bsh-road__step::before { left: 19px; top: 36px; }
  .bsh-nav__link { padding: 11px 12px; min-height: 44px; display: flex; align-items: center; }

  /* --- controls a thumb has to hit --- */
  .bsh-btn { min-height: 48px; padding: 14px 22px; }
  .bsh-btn--sm { min-height: 44px; padding: 12px 16px; }
  .bsh-lvl { min-height: 40px; display: inline-flex; align-items: center; }
  /* The wordmark stays small; only the area a thumb may land on grows. */
  .bsh-nav__logo { position: relative; }
  .bsh-nav__logo::after { content: ''; position: absolute; inset: -13px -10px; }
  .bsh-back { display: inline-flex; align-items: center; min-height: 44px; padding-right: 8px; }
  .bsh-auth__forgot {
    display: inline-flex; align-items: center; min-height: 44px;
    float: right; margin: -10px 0 8px;
  }

  /* --- forms: 16px or iOS zooms the whole page on focus --- */
  .bsh-input, .bsh-input::placeholder, textarea.bsh-input { font-size: 16px; }
  .bsh-input { padding: 13px 14px; }
  .bsh-field__label { font-size: 13px; }
  .bsh-form__actions { flex-direction: column-reverse; align-items: stretch; gap: 10px; }
  .bsh-form__actions .bsh-btn { width: 100%; }

  /* --- sign in: near the top, so the keyboard does not push it away --- */
  .bsh-auth { min-height: 0; display: block; padding: 28px 16px 48px; }
  .bsh-auth__box { margin: 0 auto; }
  .bsh-auth__logo .bsh-logo { width: 152px; height: 31px; }

  /* --- category chips: one row that scrolls, the phone-native pattern --- */
  .bsh-tabs {
    flex-wrap: nowrap; overflow-x: auto; gap: 8px;
    margin: 0 -18px 20px; padding: 2px 18px 8px;
    scrollbar-width: none; scroll-padding-inline: 18px;
  }
  .bsh-tabs::-webkit-scrollbar { display: none; }
  .bsh-tab { flex: none; min-height: 44px; padding: 11px 16px; }

  /* --- latest material: a row of columns becomes a stack --- */
  .bsh-recent__row { flex-wrap: wrap; align-items: flex-start; gap: 8px 8px; padding: 15px 0; }
  .bsh-recent__body { flex: 1 0 100%; order: 2; }
  .bsh-recent__arrow { display: none; }
  .bsh-recent__title { font-size: 15.5px; }

  /* --- article body --- */
  .bsh-prose { font-size: 16px; }
  .bsh-prose h2 { font-size: 22px; }
  .bsh-prose h3 { font-size: 18px; }
  .bsh-locked { padding: 40px 6px; }

  /* --- client list: two columns of facts under the name --- */
  .bsh-adm__row { gap: 10px 14px; }
  .bsh-adm__cell { min-width: 0; flex: 1 1 40%; }
  .bsh-adm__go { display: none; }
}

/* Narrow phones: the identity block gives up the level chip too. */
@media (max-width: 400px) {
  .bsh-nav__logo { width: 84px; height: 17px; }
  .bsh-btn--sm { padding: 12px 13px; font-size: 13.5px; }
  .bsh-h1 { font-size: 27px; }
}

/* Long words — a URL in a profile, a name with no spaces — must break
   rather than push the layout sideways. */
.bsh-prose, .bsh-art__sum, .bsh-recent__sum, .bsh-road__sub,
.bsh-adm__cell, .bsh-me__name, .bsh-me__company { overflow-wrap: anywhere; }
</style>

<div class="bsh" id="bsh-app">
  <div class="bsh-boot"><div class="bsh-boot__dot"></div></div>
</div>

<script>
(function () {
  'use strict';

  /* ===================================================================
     CONFIG
     Supabase Dashboard -> Project Settings -> API
       url     -> "Project URL"
       anonKey -> the PUBLIC key. Both formats work: the current
                  "publishable" key (sb_publishable_...) and the legacy
                  anon JWT (eyJ...).
     That key is meant to be public and is safe in page source: access is
     limited by RLS policies, not by hiding the key.
     Never put the secret key here (sb_secret_... or service_role) — it
     bypasses RLS entirely. The guard below refuses to start if you do.
     =================================================================== */
  var CONFIG = {
    url:     'https://sbyhcqjthddqbgpwmoxi.supabase.co',
    anonKey: 'sb_publishable_ci3Df8P-Eqx45sH_CdR3xg_ZpHFTBAf',
    brand:   'Battle Start',

    /* The hub paints the whole page its own background, so the builder's
       white does not show around the block. Set to false to leave the
       page colour alone. */
    paintPage: true,

    /* Pixels of air above the header. The builder usually adds padding of
       its own on top of this, so the hub clears that padding and keeps
       exactly this gap. Set to null to leave the builder's spacing alone. */
    topGap: 14
  };

  var LIB_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';

  var app = document.getElementById('bsh-app');
  var sb  = null;

  var S = {
    session:  null,   /* current Supabase session      */
    profile:  null,   /* the client's profiles row     */
    cats:     null,   /* knowledge base categories     */
    arts:     null,   /* catalogue rows, locked included */
    levels:   null,   /* level thresholds and perks    */
    rules:    null,   /* what earns experience         */
    clients:  null,   /* every profile, administrators only */
    msTypes:  null,   /* the network-wide path         */
    msMine:   null,   /* milestones this arena reached */
    missing:  [],     /* tables that are not there yet  */
    kbQuery:  '',     /* current search text           */
    recovery: false,  /* arrived from a recovery email */
    loaded:   false   /* profile + index fetched        */
  };

  /* ===================================================================
     HELPERS
     =================================================================== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function initials(name, email) {
    var src = (name || '').trim();
    if (src) {
      var parts = src.split(/\s+/);
      return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }
    return (email || '?').slice(0, 2).toUpperCase();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return '—'; }
  }

  /* Supabase errors rewritten for people */
  var ERRORS = {
    'Invalid login credentials':                'Wrong email or password',
    'Email not confirmed':                      'This email is not confirmed yet. Contact your manager.',
    'User not found':                           'No such user',
    'Password should be at least 6 characters': 'Use at least 6 characters',
    'New password should be different from the old password': 'The new password must differ from the old one',
    'Email rate limit exceeded':                'Too many emails sent. Try again in a few minutes.',
    'For security purposes, you can only request this after 60 seconds':
                                                'You can try again in a minute'
  };
  function humanError(err) {
    if (!err) return 'Something went wrong';
    var msg = err.message || String(err);
    if (ERRORS[msg]) return ERRORS[msg];
    for (var key in ERRORS) { if (msg.indexOf(key) === 0) return ERRORS[key]; }
    if (/fetch|network|Failed to fetch/i.test(msg)) return 'No connection to the server. Check your internet.';
    return msg;
  }

  function alertHtml(kind, text) {
    return '<div class="bsh-alert bsh-alert--' + kind + '">' + esc(text) + '</div>';
  }

  /* -------------------------------------------------------------------
     Small Markdown renderer for knowledge base articles.
     HTML is escaped first, so an article cannot inject markup.
     Supported: headings, lists, tables, quotes, code, links, images,
     bold/italic and horizontal rules.
     ------------------------------------------------------------------- */
  var QUOTE = /^(?:&gt;|>)\s?/;

  function markdown(src) {
    if (!src) return '';
    var lines = esc(src).replace(/\r\n/g, '\n').split('\n');
    var out = [], i = 0;

    function inline(s) {
      return s
        .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    }
    function cells(line) {
      return line.split('|').map(function (c) { return c.trim(); })
        .filter(function (c, idx, arr) { return !(c === '' && (idx === 0 || idx === arr.length - 1)); });
    }

    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      /* horizontal rule */
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* headings */
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) {
        var lvl = Math.min(h[1].length + 1, 6);
        out.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>');
        i++; continue;
      }

      /* table */
      if (line.indexOf('|') !== -1 && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1] || '')) {
        var head = cells(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1) { rows.push(cells(lines[i])); i++; }
        out.push('<div class="bsh-prose__scroll"><table><thead><tr>' +
          head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>');
        continue;
      }

      /* Blockquote. The source was escaped before it got here, so the
         marker arrives as &gt; rather than >; matching only the raw
         character left every quotation on the page as literal text. */
      if (QUOTE.test(line)) {
        var quote = [];
        while (i < lines.length && QUOTE.test(lines[i])) { quote.push(lines[i].replace(QUOTE, '')); i++; }
        out.push('<blockquote>' + inline(quote.join(' ')) + '</blockquote>');
        continue;
      }

      /* ordered list */
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++;
        }
        out.push('<ol>' + ol.join('') + '</ol>');
        continue;
      }

      /* unordered list */
      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++;
        }
        out.push('<ul>' + ul.join('') + '</ul>');
        continue;
      }

      /* paragraph */
      var para = [];
      while (i < lines.length && lines[i].trim() &&
             !/^(#{1,4}\s|&gt;|>|\s*[-*+]\s|\s*\d+\.\s)/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  /* ===================================================================
     DATA
     =================================================================== */
  function loadProfile() {
    /* Filter explicitly: an administrator's policy returns every profile,
       so relying on RLS to leave exactly one row would break for them. */
    return sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle().then(function (r) {
      if (r.error) throw r.error;
      S.profile = r.data;
      return S.profile;
    });
  }

  /* Private screens need the profile and the knowledge base index.
     Fetching them here rather than at each entry point means no route
     can arrive at a screen with half its data missing. */
  function ensureData() {
    if (S.loaded) return Promise.resolve();
    return Promise.all([loadProfile(), loadIndex()]).then(function () { S.loaded = true; });
  }

  /* A feature whose table has not been created yet should switch itself
     off, not take the hub down with it. Experience and the journey are
     additions; the knowledge base is not, so that one still throws. */
  function optional(query, table) {
    return query.then(function (r) {
      if (r.error) {
        S.missing.push(table);
        console.warn('[BSH] ' + table + ' is unavailable, that feature is hidden:', r.error.message);
        return { data: [] };
      }
      return r;
    }, function (err) {
      S.missing.push(table);
      console.warn('[BSH] ' + table + ' is unavailable, that feature is hidden:', err && err.message);
      return { data: [] };
    });
  }

  function loadIndex() {
    if (S.cats && S.arts && S.levels && S.rules && S.msTypes) return Promise.resolve();
    S.missing = [];
    return Promise.all([
      sb.from('kb_categories').select('*').eq('is_published', true).order('sort_order', { ascending: true }),
      /* kb_catalog, not kb_articles: it lists locked material too, so it
         can be advertised, but it carries no article body. */
      sb.from('kb_catalog').select('*').order('sort_order', { ascending: true }),
      optional(sb.from('levels').select('*').order('min_exp', { ascending: true }), 'levels'),
      optional(sb.from('exp_rules').select('*').order('sort_order', { ascending: true }), 'exp_rules'),
      optional(sb.from('milestone_types').select('*').order('sort_order', { ascending: true }), 'milestone_types'),
      optional(sb.from('client_milestones').select('*').eq('profile_id', S.session.user.id), 'client_milestones')
    ]).then(function (res) {
      if (res[0].error) throw res[0].error;
      if (res[1].error) throw res[1].error;
      S.cats    = res[0].data || [];
      S.arts    = res[1].data || [];
      S.levels  = res[2].data || [];
      S.rules   = res[3].data || [];
      S.msTypes = res[4].data || [];
      S.msMine  = res[5].data || [];
    });
  }

  /* -------------------------------------------------------------------
     Where the client stands. exp comes from the database, which computes
     it from the profile — the browser only presents it.
     ------------------------------------------------------------------- */
  function levelInfo() {
    var exp = (S.profile && S.profile.exp) || 0;
    var ls  = (S.levels || []).slice().sort(function (a, b) { return a.min_exp - b.min_exp; });
    if (!ls.length) return { exp: exp, level: 1, title: '', next: null, toNext: 0, pct: 100 };

    var cur = ls[0], next = null;
    for (var i = 0; i < ls.length; i++) {
      if (exp >= ls[i].min_exp) cur = ls[i];
      else { next = ls[i]; break; }
    }
    var span = next ? (next.min_exp - cur.min_exp) : 0;
    return {
      exp: exp,
      level: cur.level,
      title: cur.title,
      next: next,
      toNext: next ? next.min_exp - exp : 0,
      pct: next ? Math.max(3, Math.min(100, Math.round((exp - cur.min_exp) / span * 100))) : 100
    };
  }

  /* Fields still worth filling in, richest first. */
  function pendingTasks() {
    var p = S.profile || {};
    return (S.rules || []).filter(function (r) {
      var v = (p[r.field] == null ? '' : String(p[r.field])).trim();
      return v.length < (r.min_length || 1);
    });
  }

  function catById(id) {
    for (var i = 0; i < (S.cats || []).length; i++) { if (S.cats[i].id === id) return S.cats[i]; }
    return null;
  }
  function catBySlug(slug) {
    for (var i = 0; i < (S.cats || []).length; i++) { if (S.cats[i].slug === slug) return S.cats[i]; }
    return null;
  }

  /* ===================================================================
     RENDERING
     =================================================================== */
  function paint(html) {
    app.innerHTML = html;
    fitHost();
  }

  /* -------------------------------------------------------------------
     A page builder gives its blocks a height of their own — a Zero Block
     artboard is a fixed number of pixels, decided before this app exists.
     The hub's height changes with the screen it is showing, so after every
     render it pushes its real height onto the containers above it and
     clears any overflow that would crop it.

     Only the builder's own wrappers and elements with an inline height are
     touched, so nothing else on the page is disturbed. Outside a builder
     there is nothing up there to correct and this does nothing.
     ------------------------------------------------------------------- */
  var HOST_CLASS = /(^|\s)(t396__artboard|t396__elem|t396|tn-atom|t-rec|t-container|t123)(\s|$)/;

  var fitTimer = null;
  function fitHost() {
    /* wait for layout, then again once fonts and images have settled */
    requestAnimationFrame(function () { applyTopGap(); applyFit(); paintPage(); });
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function () { applyTopGap(); applyFit(); paintPage(); }, 450);
  }

  /* The block only covers its own column; the page around it stays the
     builder's white, which reads as a band down each side. Taking the
     colour from the app itself keeps it tied to the palette. */
  function paintPage() {
    if (CONFIG.paintPage === false || !app) return;
    var bg = window.getComputedStyle(app).backgroundColor;
    if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') return;
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
  }

  /* The block is handed whatever padding the page builder felt like
     adding — often a hundred pixels — which pushes the header down the
     screen for no reason. The hub clears that padding on its own
     wrappers and keeps the gap it actually wants. */
  function applyTopGap() {
    if (CONFIG.topGap == null || !app) return;

    var el = app.parentNode, hops = 0;
    while (el && el.nodeType === 1 && el !== document.body && hops++ < 12) {
      var cls = typeof el.className === 'string' ? el.className : '';
      if (HOST_CLASS.test(cls) || (el.style && el.style.paddingTop)) {
        if (parseFloat(window.getComputedStyle(el).paddingTop) > 0) el.style.paddingTop = '0px';
      }
      el = el.parentNode;
    }

    var nav = app.querySelector('.bsh-nav');
    if (nav) nav.style.marginTop = CONFIG.topGap + 'px';
  }

  function applyFit() {
    if (!app) return;
    var height = app.scrollHeight;
    if (!height) return;

    var el = app.parentNode, hops = 0;
    while (el && el.nodeType === 1 && el !== document.body && hops++ < 12) {
      var cls    = el.className || '';
      var inline = el.style && el.style.height;
      if (HOST_CLASS.test(typeof cls === 'string' ? cls : '') || inline) {
        var css = window.getComputedStyle(el);
        if (css.overflow === 'hidden' || css.overflowY === 'hidden') el.style.overflow = 'visible';
        /* Grow into a host the first time. After that the hub owns that
           height and sets it exactly, in both directions: turning a phone
           to landscape makes the content shorter, and a host left at the
           portrait height would leave a screen of empty space below. */
        if (el.getAttribute('data-bsh-fit') || el.offsetHeight < height) {
          el.setAttribute('data-bsh-fit', '1');
          el.style.height    = height + 'px';
          el.style.minHeight = height + 'px';
        }
      }
      el = el.parentNode;
    }
  }

  function booting() {
    paint('<div class="bsh-boot"><div class="bsh-boot__dot"></div></div>');
  }

  function fatal(text) {
    paint('<div class="bsh-wrap bsh-section"><div class="bsh-card">' +
          alertHtml('error', text) + '</div></div>');
  }

  /* The pill header, shown on every private screen */
  function header(active) {
    var p = S.profile || {};
    var email = S.session ? S.session.user.email : '';
    var links = [
      { hash: '#/hub',     label: 'Hub',            key: 'hub' },
      { hash: '#/kb',      label: 'Knowledge base', key: 'kb' },
      { hash: '#/profile', label: 'Profile',        key: 'profile' }
    ];
    if (isAdmin()) links.push({ hash: '#/admin', label: 'Clients', key: 'admin' });

    var ranked = (S.levels || []).length;
    var L      = ranked ? levelInfo() : null;

    return '<div class="bsh-wrap"><nav class="bsh-nav">' +
      '<a class="bsh-nav__logo bsh-logo" href="#/hub" aria-label="' +
        esc(CONFIG.brand) + '"></a>' +
      '<div class="bsh-nav__links">' +
        links.map(function (l) {
          return '<a class="bsh-nav__link' + (l.key === active ? ' is-active' : '') +
                 '" href="' + l.hash + '">' + l.label + '</a>';
        }).join('') +
      '</div>' +
      '<div class="bsh-nav__side">' +
        '<a class="bsh-me" href="#/profile" title="Your profile">' +
          '<span class="bsh-me__badge">' +
            (ranked ? wreathSvg() : '') +
            '<span class="bsh-me__avatar">' + esc(initials(p.full_name, email)) + '</span>' +
            (ranked ? '<span class="bsh-me__lvl">LVL ' + L.level + '</span>' : '') +
          '</span>' +
          '<span class="bsh-me__who">' +
            '<span class="bsh-me__name">' + esc(p.full_name || email) + '</span>' +
            '<span class="bsh-me__company">' + esc(p.company || p.city || email) + '</span>' +
          '</span>' +
          (ranked ? '<span class="bsh-me__exp">' + L.exp + ' EXP</span>' : '') +
        '</a>' +
        '<button class="bsh-btn bsh-btn--ghost bsh-btn--sm" id="bsh-logout" type="button">Sign out</button>' +
      '</div>' +
    '</nav></div>';
  }


  /* A laurel wreath around the avatar: the rank emblem. Drawn rather than
     drawn-on, so it takes the colour of whatever it sits in and costs the
     page nothing to load. Leaves are laid along two arcs that open at the
     top, the way a wreath is worn. */
  function wreathSvg() {
    var leaves = '', cx = 27, cy = 26, R = 21.5;
    for (var i = 0; i < 5; i++) {
      var t = i / 4;
      for (var k = 0; k < 2; k++) {
        var side = k ? -1 : 1;
        var deg  = 90 + side * (48 + t * 74);
        var rad  = deg * Math.PI / 180;
        var x    = cx + R * Math.cos(rad);
        var y    = cy + R * Math.sin(rad);
        leaves += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
                  '" rx="4.6" ry="2.4" transform="rotate(' +
                  (deg + side * 30).toFixed(0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
      }
    }
    return '<svg class="bsh-me__wreath" viewBox="0 0 54 56" aria-hidden="true">' +
             '<g fill="currentColor">' + leaves + '</g>' +
           '</svg>';
  }

  /* A row that scrolls sideways on a phone can hide the item that is
     currently chosen. Nudge it into view, without scrolling the page
     itself — scrollIntoView would drag the whole document. */
  function revealActive(scroller, selector) {
    if (!scroller) return;
    var el = scroller.querySelector(selector);
    if (!el) return;
    var want = el.offsetLeft - (scroller.clientWidth - el.offsetWidth) / 2;
    var max  = scroller.scrollWidth - scroller.clientWidth;
    if (max <= 0) return;
    scroller.scrollLeft = Math.max(0, Math.min(want, max));
  }

  function bindLogout() {
    /* The section links are a scrolling row on a phone too. */
    revealActive(document.querySelector('.bsh-nav__links'), '.bsh-nav__link.is-active');

    var btn = document.getElementById('bsh-logout');
    if (!btn) return;
    btn.addEventListener('click', function () {
      btn.classList.add('is-busy');
      btn.textContent = 'Signing out…';
      sb.auth.signOut().then(function () {
        S.session = null; S.profile = null; S.loaded = false;
        S.cats = null; S.arts = null;
        go('#/login');
      });
    });
  }

     SCREEN: SIGN IN
     =================================================================== */
  function screenLogin() {
    paint(
      '<div class="bsh-auth"><div class="bsh-auth__box">' +
        '<div class="bsh-auth__logo">' +
          '<div class="bsh-logo" role="img" aria-label="' + esc(CONFIG.brand) + '"></div>' +
          '<span>Client hub</span></div>' +
        '<div class="bsh-card">' +
          '<h1 class="bsh-h2 bsh-center" style="margin-bottom:6px">' +
            '<span class="bsh-accent">Sign in</span> to the hub</h1>' +
          '<p class="bsh-lead bsh-center bsh-muted" style="font-size:15px;margin-bottom:26px">' +

          '<div id="bsh-msg"></div>' +
          '<form id="bsh-form" novalidate>' +

            '</div>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-pass">Password</label>' +
              '<input class="bsh-input" id="bsh-pass" type="password" autocomplete="current-password" placeholder="••••••••">' +
            '</div>' +
            '<a class="bsh-auth__forgot" href="#" id="bsh-forgot">Forgot your password?</a>' +

          '</form>' +
        '</div>' +
        '<p class="bsh-auth__foot">No access yet? Message your ' + esc(CONFIG.brand) + ' manager —<br>' +
          'accounts are created by hand.</p>' +
      '</div></div>'
    );

    var form   = document.getElementById('bsh-form');
    var btn    = document.getElementById('bsh-submit');
    var msg    = document.getElementById('bsh-msg');
    var email  = document.getElementById('bsh-email');
    var pass   = document.getElementById('bsh-pass');
    var forgot = document.getElementById('bsh-forgot');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.innerHTML = '';

      var mail = email.value.trim(), pwd = pass.value;
      if (!mail || !pwd) { msg.innerHTML = alertHtml('error', 'Enter your email and password'); return; }

      btn.classList.add('is-busy');

      sb.auth.signInWithPassword({ email: mail, password: pwd }).then(function (r) {

          btn.classList.remove('is-busy');
          btn.textContent = 'Sign in';
          msg.innerHTML = alertHtml('error', humanError(r.error));
          pass.value = '';

        }

        S.loaded  = false;
        go('#/hub');

      e.preventDefault();
      msg.innerHTML = '';

      var mail = email.value.trim();

        email.focus();
        return;
      }

      forgot.textContent = 'Sending…';
      sb.auth.resetPasswordForEmail(mail, { redirectTo: pageUrl() }).then(function (r) {
        forgot.textContent = 'Forgot your password?';
        msg.innerHTML = r.error
          ? alertHtml('error', humanError(r.error))
          : alertHtml('ok', 'A reset link is on its way to ' + mail);
      });
    });

     SCREEN: SET A NEW PASSWORD
     Reached from the recovery email. The link carries a token in the
     URL hash, which supabase-js consumes on start-up.
     =================================================================== */
  function screenReset() {
    paint(
      '<div class="bsh-auth"><div class="bsh-auth__box">' +
        '<div class="bsh-card">' +
          '<h1 class="bsh-h2 bsh-center" style="margin-bottom:6px">' +
            '<span class="bsh-accent">New</span> password</h1>' +

          '<div id="bsh-msg"></div>' +
          '<form id="bsh-form" novalidate>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-p1">Password</label>' +
              '<input class="bsh-input" id="bsh-p1" type="password" autocomplete="new-password" placeholder="At least 8 characters">' +
            '</div>' +
            '<div class="bsh-field">' +
              '<label class="bsh-field__label" for="bsh-p2">Repeat password</label>' +
              '<input class="bsh-input" id="bsh-p2" type="password" autocomplete="new-password" placeholder="Once more">' +
            '</div>' +
            '<button class="bsh-btn bsh-btn--primary bsh-btn--wide" type="submit" id="bsh-submit">Save password</button>' +
          '</form>' +
        '</div>' +
        '<p class="bsh-center" style="margin-top:20px;font-size:13px">' +
          '<a class="bsh-link" href="#/login">Back to sign in</a></p>' +
      '</div></div>'
    );

    var form = document.getElementById('bsh-form');
    var btn  = document.getElementById('bsh-submit');
    var msg  = document.getElementById('bsh-msg');
    var p1   = document.getElementById('bsh-p1');
    var p2   = document.getElementById('bsh-p2');

    if (!S.session) {
      msg.innerHTML = alertHtml('error', 'This link is invalid or has expired. Request a new one from the sign-in page.');
      form.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });

    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.innerHTML = '';

      if (p1.value.length < 8)   { msg.innerHTML = alertHtml('error', 'Use at least 8 characters'); return; }
      if (p1.value !== p2.value) { msg.innerHTML = alertHtml('error', 'The passwords do not match'); return; }

      btn.classList.add('is-busy');
      btn.innerHTML = '<span class="bsh-spinner"></span>Saving…';

      sb.auth.updateUser({ password: p1.value }).then(function (r) {
        if (r.error) {
          btn.classList.remove('is-busy');
          btn.textContent = 'Save password';
